<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffb347">
<title>Família Manico 360º Nossas Compras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* layout: one full-screen kitchen-tablet app. big tappable tiles on a warm ground, four panels along the top, the family picture in the middle.
   palette: --sun #ffb347, --berry #ff5f8f, --leaf #16a34a, --ink #1f2937, --cream #fff8ee. type: Fredoka (rounded, friendly) with system rounded fallbacks. */
:root{--sun:#ffb347;--berry:#ff5f8f;--leaf:#16a34a;--ink:#1f2937;--cream:#fff8ee;--kid:"Fredoka",ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html,body{height:100%}
body{background:var(--cream);color:var(--ink);overflow:hidden}
#shop{position:fixed;inset:0;z-index:90;background:#fff8ee;color:#1f2937;font-family:var(--kid);display:flex;flex-direction:column;overflow:hidden;color-scheme:light}
#shop *{box-sizing:border-box}
#shop button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
#shop button:focus-visible,#shop .sh-in:focus-visible{outline:4px solid #ec4899;outline-offset:2px}
.sh-top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px 16px;padding:10px 18px;background:#fff;box-shadow:0 3px 0 #f3e8d8;position:relative;z-index:2}
.sh-brand{display:flex;align-items:center;gap:12px;min-width:0;grid-column:1}
.sh-fam{grid-column:2;width:112px;height:112px;border-radius:50%;object-fit:cover;background:#fff;border:5px solid #fff;box-shadow:0 0 0 4px #ffb347,0 10px 24px rgba(236,72,153,.28);animation:shfam 3.2s ease-in-out infinite}
@keyframes shfam{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-3deg)}}
.sh-top .sh-tabs{grid-column:3;justify-self:end;flex-wrap:nowrap}
@media (max-width:1240px){ .sh-top .sh-tab{min-width:0;padding:6px 10px;font-size:14px} .sh-fam{width:100px;height:100px} .sh-brand b{font-size:25px} }
@media (max-width:900px){ .sh-top .sh-tabs{grid-column:1/-1;justify-self:center} .sh-fam{width:92px;height:92px} .sh-brand b{font-size:22px} .sh-top .sh-tab{min-width:84px} }
@media (max-width:760px){ .sh-top .sh-tab{min-width:0;padding:6px 2px;font-size:13px} }
@media (max-width:560px){ .sh-top{grid-template-columns:minmax(0,1fr) auto} .sh-fam{width:66px;height:66px;border-width:3px;box-shadow:0 0 0 3px #ffb347,0 6px 14px rgba(236,72,153,.25)} }
.sh-logo{width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,#ffb347,#ff5f8f);display:grid;place-items:center;font-size:30px;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.sh-brand small{display:block;font:600 13px/1.1 var(--kid);color:#be185d;letter-spacing:.06em;text-transform:uppercase}
.sh-brand b{display:block;font:700 28px/1.05 var(--kid);color:#1f2937}
.sh-tabs{display:flex;gap:8px;flex-wrap:wrap}
.sh-tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:86px;min-height:70px;padding:8px 10px;border-radius:20px;border:3px solid transparent;background:#f7f1e8;color:#374151;font:600 16px/1.1 var(--kid)}
.sh-tab .e{font-size:28px;line-height:1}
.sh-tab[aria-current="page"]{background:#fff;border-color:#ff8a65;color:#c2410c;box-shadow:0 4px 12px rgba(255,138,101,.28)}
.sh-tab .n{position:absolute;top:-8px;right:-6px;background:#16a34a;color:#fff;border-radius:13px;min-width:26px;height:26px;font:700 14px/20px var(--kid);padding:0 6px;border:3px solid #fff}
.sh-close{background:#1f2937!important;color:#fff!important}
.sh-close .e{font-size:24px!important;font-weight:700}
.sh-main{flex:1;overflow:auto;padding:20px 18px 130px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sh-wrap{max-width:1100px;margin:0 auto;display:grid;gap:18px}
.sh-cats{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.sh-cat{display:flex;align-items:center;gap:8px;min-height:60px;padding:0 22px;border-radius:999px;border:3px solid var(--c);background:#fff;color:var(--c);font:600 20px/1 var(--kid);white-space:nowrap;flex:none}
.sh-cat .e{font-size:28px}
.sh-cat[aria-pressed="true"]{background:var(--c);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 40%,transparent)}
.sh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.sh-tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:170px;padding:18px 10px;border-radius:28px;border:4px solid #f1e6d6;background:#fff;color:#1f2937;box-shadow:0 5px 0 #efe3d1;transition:transform .12s,background .15s}
.sh-tile .e{font-size:68px;line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.12))}
.sh-tile .t{font:600 20px/1.15 var(--kid);text-align:center}
.sh-tile:active{transform:scale(.95)}
.sh-tile.on{border-color:var(--c);background:var(--s);box-shadow:0 5px 0 var(--c)}
.sh-tile .ck{position:absolute;top:10px;right:10px;min-width:40px;height:40px;padding:0 8px;border-radius:20px;background:var(--c);color:#fff;display:grid;place-items:center;font:700 19px/1 var(--kid)}
.sh-tile.pop{animation:shpop .38s ease}
@keyframes shpop{0%{transform:scale(1)}40%{transform:scale(1.12) rotate(-3deg)}100%{transform:scale(1)}}
.sh-tile.add{border-style:dashed;border-color:#f59e0b;background:#fffbeb;color:#b45309}
.sh-plus{position:absolute;left:50%;top:28%;font:700 30px var(--kid);color:#16a34a;pointer-events:none;animation:shplus .75s ease-out forwards}
@keyframes shplus{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}
.sh-bar{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:26px 18px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(255,248,238,0),#fff8ee 45%);display:flex;justify-content:center;gap:12px;pointer-events:none}
.sh-bar>*{pointer-events:auto}
.sh-big{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:66px;padding:0 28px;border-radius:999px;border:0;font:600 22px/1.1 var(--kid);color:#fff;background:linear-gradient(145deg,#22c55e,#15803d);box-shadow:0 6px 0 #14532d;text-align:center}
.sh-big:disabled{opacity:.7;cursor:wait}
.sh-big:active{transform:translateY(3px);box-shadow:0 3px 0 #14532d}
.sh-big.alt{background:#fff;color:#1f2937;box-shadow:0 5px 0 #e5d9c6;border:3px solid #eadfcd}
.sh-big.pink{background:linear-gradient(145deg,#ff8a65,#ec4899);box-shadow:0 6px 0 #9d174d}
.sh-big.warn{background:#fff;color:#b91c1c;border:3px solid #fecaca;box-shadow:0 5px 0 #fecaca}
.sh-big .e{font-size:28px;line-height:1}
.sh-card{background:#fff;border-radius:28px;padding:20px;box-shadow:0 5px 0 #efe3d1;border:3px solid #f1e6d6}
.sh-h{font:700 27px/1.15 var(--kid);margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:#1f2937}
.sh-meta{color:#5b6472;font:500 17px/1.4 var(--kid)}
.sh-grp{display:flex;align-items:center;gap:8px;font:700 17px var(--kid);color:var(--c);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 4px}
.sh-row{display:grid;grid-template-columns:66px minmax(0,1fr) auto;align-items:center;gap:14px;padding:10px 2px;border-bottom:2px dashed #f1e6d6}
.sh-row:last-child{border-bottom:0}
.sh-ic{width:66px;height:66px;border-radius:22px;background:var(--s);display:grid;place-items:center;font-size:40px}
.sh-name{font:600 23px/1.15 var(--kid)}
.sh-hint{display:inline-flex;margin-top:5px;padding:4px 12px;border-radius:999px;background:#dcfce7;color:#166534;font:500 15px var(--kid)}
.sh-link{margin-top:4px;border:0;background:none;padding:4px 0;color:#b45309;font:500 16px var(--kid);text-decoration:underline;text-underline-offset:3px}
.sh-step{display:flex;align-items:center;gap:8px}
.sh-step button{width:56px;height:56px;border-radius:50%;border:0;font:700 30px/1 var(--kid);background:#f1f5f9;color:#1f2937;flex:none}
.sh-step button.p{background:#22c55e;color:#fff}
.sh-step .q{min-width:46px;text-align:center;font:700 28px var(--kid)}
.sh-empty{text-align:center;padding:40px 18px;display:grid;gap:14px;justify-items:center}
.sh-empty>.e{font-size:92px;line-height:1}
.sh-in{width:100%;min-height:60px;border-radius:18px;border:3px solid #eadfcd;background:#fff;padding:0 16px;font:500 22px var(--kid);color:#1f2937}
.sh-in:focus{outline:none;border-color:#ff8a65;box-shadow:0 0 0 4px rgba(255,138,101,.22)}
.sh-lab{display:grid;gap:7px;font:600 18px var(--kid);color:#374151}
.sh-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.sh-pills{display:flex;gap:10px;flex-wrap:wrap}
.sh-pill{min-height:54px;padding:0 20px;border-radius:999px;border:3px solid #eadfcd;background:#fff;font:600 19px var(--kid);color:#374151}
.sh-pill[aria-pressed="true"]{background:#1f2937;border-color:#1f2937;color:#fff}
.sh-price{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;min-height:56px;padding:6px 8px 6px 14px;border-radius:16px;background:#f8fafc;font:500 20px var(--kid)}
.sh-price.best{background:#dcfce7;color:#14532d;font-weight:700}
.sh-price .d{font-size:16px;color:#b91c1c;font-weight:600}
.sh-x{width:48px;height:48px;border-radius:50%;border:0;background:transparent;color:#94a3b8;font:700 21px var(--kid)}
.sh-x:hover{background:#fee2e2;color:#b91c1c}
.sh-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.sh-stat{border-radius:20px;padding:14px 16px;background:#f8fafc}
.sh-stat .v{font:700 34px/1.1 var(--kid)}
.sh-stat.g{background:#dcfce7;color:#14532d}
.sh-verdict{padding:12px 16px;border-radius:18px;background:#fef3c7;color:#78350f;font:500 19px/1.4 var(--kid)}
.sh-verdict b{font-weight:700}
.sh-modal{position:absolute;inset:0;z-index:20;background:rgba(31,41,55,.5);display:grid;place-items:center;padding:16px}
.sh-modal>.sh-card{width:min(600px,100%);max-height:92vh;overflow:auto;display:grid;gap:16px;animation:shup .25s ease both}
.sh-toast{position:absolute;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;max-width:calc(100% - 32px);background:#1f2937;color:#fff;padding:14px 24px;border-radius:24px;font:600 19px/1.3 var(--kid);box-shadow:0 10px 26px rgba(0,0,0,.25);text-align:center}
.sh-splash{position:absolute;inset:0;z-index:40;display:grid;place-items:center;overflow:hidden;cursor:pointer;background:radial-gradient(circle at 25% 18%,#fff3b0 0,rgba(255,243,176,0) 42%),radial-gradient(circle at 82% 82%,#ffc2d6 0,rgba(255,194,214,0) 48%),linear-gradient(160deg,#7dd3fc,#a78bfa 55%,#f9a8d4);transition:opacity .45s,transform .45s}
.sh-splash.bye{opacity:0;transform:scale(1.06);pointer-events:none}
.sh-float{position:absolute;top:-90px;animation:shfall linear infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.15))}
@keyframes shfall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(calc(100vh + 180px)) rotate(360deg)}}
.sh-sp-in{position:relative;text-align:center;display:grid;gap:16px;justify-items:center;padding:24px}
.sh-sp-cart{font-size:124px;line-height:1;animation:shcart 1.1s cubic-bezier(.2,.9,.3,1.3) both,shbob 2.4s 1.1s ease-in-out infinite}
@keyframes shcart{from{transform:translateX(-75vw) rotate(-12deg)}to{transform:none}}
@keyframes shbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.sh-sp-fam{background:#fff;color:#7c3aed;font:700 19px/1 var(--kid);padding:11px 20px;border-radius:999px;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 6px 18px rgba(0,0,0,.12);animation:shup .6s .45s both}
.sh-sp-t{margin:0;font:700 clamp(50px,9.5vw,104px)/1 var(--kid);color:#fff;text-shadow:0 5px 0 #db2777,0 12px 26px rgba(0,0,0,.2);display:flex;flex-wrap:wrap;justify-content:center}
.sh-sp-t span{display:inline-block;animation:shletter .6s cubic-bezier(.2,.9,.3,1.5) both}
@keyframes shletter{from{opacity:0;transform:translateY(40px) scale(.4)}to{opacity:1;transform:none}}
@keyframes shup{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.sh-sp-sub{font:600 24px/1.3 var(--kid);color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.22);animation:shup .6s 1.3s both}
.sh-sp-go{animation:shup .6s 1.5s both}
@media (max-width:760px){
  .sh-top{padding:10px 12px}
  .sh-brand b{font-size:22px} .sh-logo{width:46px;height:46px;font-size:26px}
  .sh-tabs{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .sh-tab{min-width:0;min-height:62px;font-size:13px;padding:6px 2px} .sh-tab .e{font-size:24px}
  .sh-main{padding:14px 12px 130px}
  .sh-grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
  .sh-tile{min-height:146px} .sh-tile .e{font-size:56px} .sh-tile .t{font-size:18px}
  .sh-row{grid-template-columns:54px minmax(0,1fr)} .sh-row .sh-step{grid-column:1/-1;justify-content:flex-end} .sh-row .sh-x{grid-column:auto}
  .sh-ic{width:54px;height:54px;font-size:32px}
  .sh-big{font-size:19px;min-height:60px;padding:0 20px}
  .sh-price{font-size:18px}
}
@media (prefers-reduced-motion:reduce){#shop *,#shopfab *{animation:none!important;transition:none!important} .sh-float{display:none}}
.sh-toast.top{top:14px;bottom:auto}
.sh-sel{background:#fff8ee;border:3px dashed #eadfcd;border-radius:16px;padding:12px 16px;font:600 20px/1.35 var(--kid);color:#1f2937;user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}
a.sh-big{text-decoration:none}
.sh-top{padding-top:calc(10px + env(safe-area-inset-top,0px))}

</style>
</head>
<body>
<div id="shop" lang="pt"><header class="sh-top" id="sh-top"></header><div class="sh-main" id="sh-main"></div></div>

function parseNumber(tok){ let t=String(tok).replace(/\s/g,""); const ld=t.lastIndexOf("."), lc=t.lastIndexOf(",");
  if(ld>-1&&lc>-1){ const dec=ld>lc?".":","; t=t.split(dec==="."?",":".").join("").replace(",","."); }
  else if(lc>-1){ t=(/,\d{1,2}$/.test(t)&&t.split(",").length===2)?t.replace(",","."):t.replace(/,/g,""); }
  else if(/^\d{1,3}(\.\d{3})+$/.test(t)) t=t.replace(/\./g,"");
  return parseFloat(t); }

function askYesNo(message,yesLabel){ return new Promise(res=>{
  const root=document.createElement("div"); root.className="sh-modal sh-yn"; root.style.zIndex=60;
  root.innerHTML=`<div class="sh-card" role="alertdialog" aria-modal="true" aria-labelledby="yn-h"><h2 class="sh-h" id="yn-h">Tem a certeza?</h2><p class="sh-meta" style="margin:0;font-size:20px">${esc(message)}</p><div class="sh-pills"><button type="button" class="sh-big alt" id="yn-no">Não</button><button type="button" class="sh-big warn" id="yn-yes">${esc(yesLabel||"Sim, apagar")}</button></div></div>`;
  $("shop").append(root);
  const done=v=>{ root.remove(); document.removeEventListener("keydown",key,true); res(v); };
  const key=e=>{ if(e.key==="Escape"){ e.stopPropagation(); done(false); } };
  document.addEventListener("keydown",key,true);
  root.querySelector("#yn-no").onclick=()=>done(false); root.querySelector("#yn-yes").onclick=()=>done(true);
  root.addEventListener("click",e=>{ if(e.target===root) done(false); });
  root.querySelector("#yn-no").focus(); }); }

function shopList(){ const list=shopData().list||{}, cat=shopCatalog(), order=SHOP_CATS.map(c=>c.k);
  return Object.entries(list).map(([id,q])=>[cat.find(i=>i.id===id),+q]).filter(([it,q])=>it&&q>0).sort((a,b)=>order.indexOf(a[0].cat)-order.indexOf(b[0].cat)||a[0].name.localeCompare(b[0].name,"pt")); }
function shopGuessCat(name){ const n=shopNorm(name); for(const k of ["casa","frescos","fruta"]) if(SHOP_KW[k].some(w=>n.includes(shopNorm(w)))) return k; return "despensa"; }
function shopGuessEmoji(name,cat){ const n=shopNorm(name); const hit=SHOP_EMOJI.find(([w])=>n.includes(w)); if(hit) return hit[1]; const b=SHOP_BUILTIN.find(it=>n.includes(shopNorm(it.name).split(" ")[0].replace(/s$/,""))); if(b) return b.e; return shopCat(cat).e; }

/* ---------- prices ---------- */
function shopPriceGroups(){ const g=new Map(); for(const p of (shopData().prices||[])){ const k=shopNorm(p.item)+"|"+shopNorm(p.size||""); if(!g.has(k)) g.set(k,{item:p.item,size:p.size||"",rows:[]}); g.get(k).rows.push(p); } const out=[...g.values()]; for(const x of out) x.rows.sort((a,b)=>a.price-b.price||a.market.localeCompare(b.market)); return out; }
function shopBestGroup(name){ const gs=shopPriceGroups().filter(g=>shopSame(g.item,name)); return gs.sort((a,b)=>b.rows.length-a.rows.length)[0]||null; }
function shopJoin(a){ return a.length<2?a.join(""):a.slice(0,-1).join(", ")+" e "+a[a.length-1]; }
function shopVerdict(g){ const best=g.rows[0].price, winners=g.rows.filter(r=>r.price===best), rest=g.rows.filter(r=>r.price!==best);
  if(g.rows.length===1) return `Só há o preço do ${esc(g.rows[0].market)}. Regista outro mercado para comparar.`;
  if(!rest.length) return `Empate: ${esc(shopJoin(winners.map(r=>r.market)))} têm o mesmo preço (${fmtE(best)}).`;
  const who=winners.length>1?`${shopJoin(winners.map(r=>r.market))} são os mais baratos`:`${winners[0].market} é o mais barato`;
  return `<b>${esc(who)}</b> — poupa ${esc(shopJoin(rest.map(r=>`${fmtE(r.price-best)} vs ${r.market}`)))}.`; }
function shopSavings(){ let cheap=0, dear=0; const markets={}, lines=[], L=shopList();
  for(const [it,q] of L){ const g=shopBestGroup(it.name); if(!g) continue; const min=g.rows[0], max=g.rows[g.rows.length-1]; cheap+=min.price*q; dear+=max.price*q; lines.push({it,q,g});
    const seen=new Set(); for(const r of g.rows){ if(seen.has(r.market)) continue; seen.add(r.market); const m=markets[r.market]||(markets[r.market]={sum:0,n:0}); m.sum+=r.price*q; m.n++; } }
  return {cheap,dear,save:dear-cheap,covered:lines.length,total:L.length,markets,lines}; }

function shopKey(e){ if(e.key!=="Escape") return; if(document.querySelector(".sh-yn")) return; if(S.shop.modal){ S.shop.modal=null; renderShop(); } }
function openShop(){ const el=$("shop"); el.addEventListener("click",shopClick); el.addEventListener("submit",shopSubmit); el.addEventListener("input",shopInput); document.addEventListener("keydown",shopKey);
  S.shop.tab="choose"; S.shop.modal=null; renderShop(true); if(shopData().splash!==false) shopSplash(el); }
function shopSplash(root){
  const F=["🍎","🥕","🍌","🥛","🍞","🧀","🍓","🥚","🍇","🧃","🍪","🥦","🍊","🍉","🥑","🍯"];
  const title="Nossas Compras"; const sp=document.createElement("div"); sp.className="sh-splash";
  sp.innerHTML=`${F.map((e,i)=>`<span class="sh-float" aria-hidden="true" style="left:${Math.round(i*6.2+Math.random()*3)}%;animation-duration:${(5.5+Math.random()*4).toFixed(1)}s;animation-delay:-${(Math.random()*7).toFixed(1)}s;font-size:${Math.round(38+Math.random()*34)}px">${e}</span>`).join("")}
    <div class="sh-sp-in"><div class="sh-sp-cart" aria-hidden="true">🛒</div><div class="sh-sp-fam">Família Manico 360º</div>
    <h1 class="sh-sp-t" aria-label="${title}">${[...title].map((c,i)=>`<span aria-hidden="true" style="animation-delay:${(.55+i*.06).toFixed(2)}s">${c===" "?"&nbsp;":esc(c)}</span>`).join("")}</h1>
    <div class="sh-sp-sub">Toca nos produtos e enche o cesto! 🧺</div>
    <button class="sh-big pink sh-sp-go" type="button"><span class="e" aria-hidden="true">🚀</span>Vamos às compras!</button></div>`;
  root.append(sp);
  const bye=()=>{ if(sp.classList.contains("bye")) return; sp.classList.add("bye"); setTimeout(()=>sp.remove(),480); };
  sp.addEventListener("click",bye); setTimeout(bye,4500);
}
function shopToast(msg){ const el=$("shop"); if(!el){ toast(msg); return; } el.querySelector(".sh-toast")?.remove(); const t=document.createElement("div"); t.className="sh-toast"+(el.querySelector(".sh-modal")?" top":""); t.setAttribute("role","status"); t.textContent=msg; el.append(t); setTimeout(()=>t.remove(),2800); }

function shopTop(){ const n=shopList().length, t=S.shop.tab;
  const tab=(k,e,l,badge)=>`<button type="button" class="sh-tab" data-shtab="${k}" ${t===k?'aria-current="page"':""}><span class="e" aria-hidden="true">${e}</span>${l}${badge?`<span class="n">${badge}</span>`:""}</button>`;
  return `<div class="sh-brand"><span class="sh-logo" aria-hidden="true">🛒</span><span><small>Família Manico 360º</small><b>Nossas Compras</b></span></div>

    <nav class="sh-tabs" aria-label="Painéis">${tab("choose","🛍️","Escolher")}${tab("list","📝","Lista",n)}${tab("prices","💰","Preços")}${tab("settings","⚙️","Definições")}</nav>`; }
function shopTile(it,list){ const c=shopCat(it.cat), q=list[it.id];
  return `<button type="button" class="sh-tile${q?" on":""}" data-shitem="${esc(it.id)}" style="--c:${c.c};--s:${c.s}" aria-pressed="${!!q}"><span class="e" aria-hidden="true">${it.e}</span><span class="t">${esc(it.name)}</span>${q?`<span class="ck" aria-label="na lista">${q>1?"×"+shopQty(q):"✓"}</span>`:""}</button>`; }
function shopChooseView(){ const d=shopData(), list=d.list||{}, cat=S.shop.cat, n=shopList().length;
  const cats=[SHOP_BASIC,...SHOP_CATS].map(c=>`<button type="button" class="sh-cat" data-shcat="${c.k}" style="--c:${c.c}" aria-pressed="${cat===c.k}"><span class="e" aria-hidden="true">${c.e}</span>${c.name}</button>`).join("");
  const items=cat==="basica"?shopCatalog().filter(i=>i.basic):shopCatalog().filter(i=>i.cat===cat);

    ${cat==="basica"&&missing?`<button type="button" class="sh-big" data-shbasic="1" style="justify-self:start;background:linear-gradient(145deg,#fbbf24,#d97706);box-shadow:0 6px 0 #92400e"><span class="e" aria-hidden="true">⭐</span>Pôr a cesta básica toda na lista (${missing})</button>`:""}
    <div class="sh-grid">${items.map(it=>shopTile(it,list)).join("")}<button type="button" class="sh-tile add" data-shadd="1"><span class="e" aria-hidden="true">➕</span><span class="t">Outro artigo</span></button></div>
    <div class="sh-bar"><button type="button" class="sh-big" data-shtab="list"><span class="e" aria-hidden="true">📝</span>Ver a minha lista${n?` (${n})`:""}</button></div>`; }
function shopListView(){ const L=shopList(), d=shopData();
  if(!L.length) return `<section class="sh-card sh-empty"><span class="e" aria-hidden="true">🧺</span><h2 class="sh-h" style="justify-content:center">A lista está vazia</h2><p class="sh-meta" style="margin:0">Toca nos produtos para os juntares à lista!</p><div class="sh-pills" style="justify-content:center"><button type="button" class="sh-big" data-shtab="choose"><span class="e" aria-hidden="true">🛍️</span>Escolher produtos</button><button type="button" class="sh-big alt" data-shadd="1"><span class="e" aria-hidden="true">➕</span>Adicionar artigo</button></div></section>`;
  const groups=SHOP_CATS.map(c=>{ const rows=L.filter(([it])=>it.cat===c.k); if(!rows.length) return "";
    return `<div class="sh-grp" style="--c:${c.c}"><span aria-hidden="true">${c.e}</span>${c.name}</div>${rows.map(([it,q])=>{ const g=shopBestGroup(it.name);
      return `<div class="sh-row"><span class="sh-ic" style="--s:${c.s}" aria-hidden="true">${it.e}</span><div style="min-width:0"><div class="sh-name">${esc(it.name)}</div>${g?`<span class="sh-hint">🏆 ${esc(g.rows[0].market)} ${fmtE(g.rows[0].price)}${g.size?" · "+esc(g.size):""}</span>`:`<button type="button" class="sh-link" data-shpricefor="${esc(it.name)}">💰 registar preço</button>`}</div>
        <div class="sh-step"><button type="button" data-shq="${esc(it.id)}|-1" aria-label="Menos ${esc(it.name)}">−</button><span class="q" aria-live="polite">${shopQty(q)}</span><button type="button" class="p" data-shq="${esc(it.id)}|1" aria-label="Mais ${esc(it.name)}">+</button></div></div>`; }).join("")}`; }).join("");
  return `<section class="sh-card"><h2 class="sh-h"><span aria-hidden="true">📝</span>A nossa lista <span class="sh-meta">${L.length} ${L.length===1?"artigo":"artigos"}</span></h2>${groups}</section>
    <div class="sh-pills"><button type="button" class="sh-big" data-shsend="1"><span class="e" aria-hidden="true">✉️</span>Enviar lista</button><button type="button" class="sh-big alt" data-shadd="1"><span class="e" aria-hidden="true">➕</span>Adicionar artigo</button><button type="button" class="sh-big alt" data-shcopy="1"><span class="e" aria-hidden="true">📋</span>Copiar</button><button type="button" class="sh-big warn" data-shclear="1"><span class="e" aria-hidden="true">🧹</span>Limpar lista</button></div>
    <p class="sh-meta" style="margin:0">${d.email?`Vai para <b>${esc(d.email)}</b>. `:"Ainda sem e-mail de destino: define-o em ⚙️ Definições. "}Ao tocar em Enviar lista, a lista fica pronta para abrir no e-mail ou copiar.</p>`; }
function shopPricesView(){ const pf=S.shop.pf||{}, mkt=S.shop.mkt||"Mercadona", groups=shopPriceGroups(), sv=shopSavings();
  const listNames=shopList().map(([it])=>it.name);
  const inList=g=>listNames.some(n=>shopSame(n,g.item));
  groups.sort((a,b)=>(inList(b)?1:0)-(inList(a)?1:0)||a.item.localeCompare(b.item,"pt")||a.size.localeCompare(b.size,"pt"));
  const names=[...new Set([...listNames,...shopCatalog().map(i=>i.name),...groups.map(g=>g.item)])];
  const form=`<section class="sh-card" style="display:grid;gap:14px"><h2 class="sh-h"><span aria-hidden="true">🏷️</span>Registar um preço</h2>
    <form id="sh-pform" class="sh-form" autocomplete="off">
      <label class="sh-lab">Artigo<input class="sh-in" id="sh-pitem" data-shpf="item" list="sh-dl" value="${esc(pf.item||"")}" placeholder="ex. Arroz"></label>
      <label class="sh-lab">Tamanho ou embalagem<input class="sh-in" id="sh-psize" data-shpf="size" value="${esc(pf.size||"")}" placeholder="ex. 1 kg"></label>
      <label class="sh-lab">Preço (€)<input class="sh-in" id="sh-pprice" data-shpf="price" inputmode="decimal" value="${esc(pf.price||"")}" placeholder="ex. 1,29"></label>
      <div class="sh-lab" style="grid-column:1/-1">Mercado<div class="sh-pills" role="group" aria-label="Mercado">${SHOP_MARKETS.map(m=>`<button type="button" class="sh-pill" data-shmkt="${esc(m)}" aria-pressed="${mkt===m}">${esc(m)}</button>`).join("")}</div>
        ${mkt==="Outro"?`<input class="sh-in" id="sh-pother" data-shpf="other" value="${esc(pf.other||"")}" placeholder="Nome do mercado" style="max-width:360px">`:""}</div>
      <div style="grid-column:1/-1"><button class="sh-big" type="submit"><span class="e" aria-hidden="true">💾</span>Guardar preço</button></div>
    </form><datalist id="sh-dl">${names.map(n=>`<option value="${esc(n)}">`).join("")}</datalist></section>`;
  const mk=Object.entries(sv.markets).sort((a,b)=>b[1].n-a[1].n||a[1].sum-b[1].sum);
  const fullBest=mk.filter(([,m])=>m.n===sv.covered).sort((a,b)=>a[1].sum-b[1].sum)[0];
  const summary=sv.covered?`<section class="sh-card" style="display:grid;gap:14px"><h2 class="sh-h"><span aria-hidden="true">🧾</span>Poupança na lista atual</h2>
      <p class="sh-meta" style="margin:0">${sv.covered} de ${sv.total} artigos da lista têm preços registados. Contas feitas com as quantidades da lista.</p>
      <div class="sh-sum"><div class="sh-stat g"><div class="sh-meta" style="color:inherit">Poupança possível</div><div class="v">${fmtE(sv.save)}</div></div><div class="sh-stat"><div class="sh-meta">Tudo no mais barato</div><div class="v">${fmtE(sv.cheap)}</div></div><div class="sh-stat"><div class="sh-meta">Tudo no mais caro</div><div class="v">${fmtE(sv.dear)}</div></div></div>
      <div class="sh-verdict">💡 Se comprares cada artigo no mercado mais barato, gastas <b>${fmtE(sv.cheap)}</b> em vez de ${fmtE(sv.dear)} — poupas <b>${fmtE(sv.save)}</b>.${fullBest&&mk.length>1?` Se preferires ir a um só sítio, o <b>${esc(fullBest[0])}</b> é o mais barato para estes artigos (${fmtE(fullBest[1].sum)}).`:""}</div>
      <div style="display:grid;gap:8px">${sv.lines.map(({it,q,g})=>{ const min=g.rows[0], max=g.rows[g.rows.length-1]; return `<div class="sh-price"><span><span aria-hidden="true">${it.e}</span> ${esc(it.name)} × ${shopQty(q)}${g.size?` <span class="sh-meta" style="font-size:14px">${esc(g.size)}</span>`:""}</span><span>🏆 ${esc(min.market)} ${fmtE(min.price*q)}</span><span class="d" style="color:#15803d">${max.price>min.price?"−"+fmtE((max.price-min.price)*q):""}</span></div>`; }).join("")}</div>
      ${mk.length>1?`<div><div class="sh-grp" style="--c:#374151">🏪 Comprar tudo num só mercado</div><div style="display:grid;gap:8px">${mk.map(([m,x])=>`<div class="sh-price${fullBest&&fullBest[0]===m?" best":""}"><span>${fullBest&&fullBest[0]===m?"🏆 ":""}${esc(m)}</span><span>${fmtE(x.sum)}</span><span class="sh-meta" style="font-size:14px">${x.n} de ${sv.covered} artigos</span></div>`).join("")}</div></div>`:""}
    </section>`:"";
  const report=groups.length?groups.map(g=>{ const it=shopFind(g.item), best=g.rows[0].price;
    return `<section class="sh-card" style="display:grid;gap:10px"><h3 class="sh-h" style="font-size:22px"><span aria-hidden="true">${it?it.e:"🏷️"}</span>${esc(g.item)}${g.size?`<span class="sh-meta">— ${esc(g.size)}</span>`:""}${inList(g)?`<span class="sh-hint" style="margin:0">na lista</span>`:""}</h3>
      <div class="sh-verdict">🏆 ${shopVerdict(g)}</div>
      <div style="display:grid;gap:8px">${g.rows.map(r=>`<div class="sh-price${r.price===best&&g.rows.length>1?" best":""}"><span>${r.price===best&&g.rows.length>1?"🏆 ":""}${esc(r.market)} <span class="sh-meta" style="font-size:14px">${fmtDate(r.date)}</span></span><span>${fmtE(r.price)}${r.price>best?` <span class="d">+${fmtE(r.price-best)}</span>`:""}</span><button type="button" class="sh-x" data-shdelprice="${esc(r.id)}" aria-label="Apagar preço do ${esc(r.market)}">✕</button></div>`).join("")}</div></section>`; }).join("")
    :`<section class="sh-card sh-empty"><span class="e" aria-hidden="true">🏷️</span><h2 class="sh-h" style="justify-content:center">Ainda sem preços</h2><p class="sh-meta" style="margin:0">Regista o mesmo artigo em mercados diferentes — por exemplo “Arroz, 1 kg” no Mercadona, no Pingo Doce e no Aldi — e o relatório mostra logo o mais barato.</p></section>`;
  return form+summary+`<h2 class="sh-h" style="margin-top:4px"><span aria-hidden="true">📊</span>Relatório por artigo</h2>`+report; }

      <form id="sh-sform" style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end" autocomplete="off"><label class="sh-lab" style="flex:1 1 280px">Para onde vai a lista<input class="sh-in" id="sh-email" type="email" multiple value="${esc(S.shop.emailDraft??d.email??"")}" data-shemail="1" placeholder="ex. familia@exemplo.pt"></label><button class="sh-big" type="submit"><span class="e" aria-hidden="true">💾</span>Guardar</button></form>

      <button type="button" class="sh-big ${d.splash===false?"alt":""}" data-shsplash="1" style="justify-self:start"><span class="e" aria-hidden="true">${d.splash===false?"🌙":"🎉"}</span>${d.splash===false?"Desligada — tocar para ligar":"Ligada — tocar para desligar"}</button></section>
    <section class="sh-card" style="display:grid;gap:10px"><h2 class="sh-h"><span aria-hidden="true">🧺</span>Artigos criados por nós <span class="sh-meta">${custom.length}</span></h2>
      ${custom.length?custom.map(c=>`<div class="sh-row"><span class="sh-ic" style="--s:${shopCat(c.cat).s}" aria-hidden="true">${c.e}</span><div><div class="sh-name">${esc(c.name)}</div><div class="sh-meta">${esc(shopCat(c.cat).name)}</div></div><button type="button" class="sh-x" data-shdelcustom="${esc(c.id)}" aria-label="Apagar ${esc(c.name)}">✕</button></div>`).join(""):`<p class="sh-meta" style="margin:0">Os artigos novos que escreveres em “Adicionar artigo” aparecem aqui.</p>`}</section>
    <p class="sh-meta" style="margin:0">A lista, os preços e estas definições ficam guardados só neste aparelho. Noutro telemóvel ou tablet a lista começa vazia.</p>`; }
function shopAddModal(){ const q=S.shop.aq??"1";
  return `<div class="sh-modal"><form class="sh-card" id="sh-aform" role="dialog" aria-modal="true" aria-labelledby="sh-ah" autocomplete="off">
    <div style="display:flex;align-items:center;gap:10px"><h2 class="sh-h" id="sh-ah" style="margin-right:auto"><span aria-hidden="true">➕</span>Adicionar artigo</h2><button type="button" class="sh-x" data-shmodalx="1" aria-label="Fechar">✕</button></div>

    <div class="sh-lab">Quantos?<div class="sh-step"><button type="button" data-shaq="-1" aria-label="Menos">−</button><input class="sh-in" id="sh-aqv" data-shaqv="1" inputmode="decimal" value="${esc(q)}" style="width:110px;text-align:center;font-weight:700" aria-label="Quantidade"><button type="button" class="p" data-shaq="1" aria-label="Mais">+</button></div></div>

function shopAddPreviewHtml(){ const name=(S.shop.aname||"").trim(); if(!name) return `<p class="sh-meta" style="margin:0">Se o artigo já existir, somamos a quantidade. Se for novo, criamos um cartão na categoria certa.</p>`;
  const f=shopFind(name); if(f) return `<div class="sh-verdict">${f.e} Já existe: <b>${esc(f.name)}</b> — vamos somar a quantidade.</div>`;
  const cat=S.shop.acat||shopGuessCat(name);

    <div class="sh-verdict">Novo cartão: <span style="font-size:28px" aria-hidden="true">${shopGuessEmoji(name,cat)}</span> <b>${esc(shopTitle(name))}</b> em ${esc(shopCat(cat).name)}</div>`; }

function renderShop(resetScroll){ const el=$("shop"); if(!el) return; const main=$("sh-main"), y=main.scrollTop, t=S.shop.tab;
  $("sh-top").innerHTML=shopTop();
  main.innerHTML=`<div class="sh-wrap">${t==="list"?shopListView():t==="prices"?shopPricesView():t==="settings"?shopSettingsView():shopChooseView()}</div>`;
  main.scrollTop=resetScroll?0:y;
  el.querySelector(".sh-modal:not(.sh-yn)")?.remove(); if(S.shop.modal==="add") el.insertAdjacentHTML("beforeend",shopAddModal()); else if(S.shop.modal==="send") el.insertAdjacentHTML("beforeend",shopSendModal());
  if(S.shop.pop){ const tile=main.querySelector(`[data-shitem="${CSS.escape(S.shop.pop)}"]`); if(tile){ tile.classList.add("pop"); tile.insertAdjacentHTML("beforeend",`<span class="sh-plus" aria-hidden="true">+1</span>`); } S.shop.pop=null; }
}

function shopInput(ev){ const t=ev.target;
  if(t.dataset.shpf){ S.shop.pf={...(S.shop.pf||{}),[t.dataset.shpf]:t.value}; return; }
  if(t.dataset.shaname){ S.shop.aname=t.value; S.shop.acat=null; const p=$("sh-apreview"); if(p) p.innerHTML=shopAddPreviewHtml(); return; }
  if(t.dataset.shaqv){ S.shop.aq=t.value; return; }
  if(t.dataset.shemail){ S.shop.emailDraft=t.value; return; } }
async function shopClick(ev){ const t=ev.target, g=a=>t.closest(`[${a}]`); let x;
  if(t.classList?.contains("sh-modal")){ S.shop.modal=null; renderShop(); return; }
  if(x=g("data-shtab")){ S.shop.tab=x.dataset.shtab; S.shop.modal=null; renderShop(true); return; }
  if(x=g("data-shcat")){ S.shop.cat=x.dataset.shcat; renderShop(true); return; }
  if(x=g("data-shitem")){ const id=x.dataset.shitem, list={...(shopData().list||{})}; if(list[id]) delete list[id]; else { list[id]=1; S.shop.pop=id; } shopSave({list}); return; }
  if(x=g("data-shq")){ const [id,dd]=x.dataset.shq.split("|"); const list={...(shopData().list||{})}; const v=Math.round(((+list[id]||0)+ +dd)*100)/100; if(v<=0) delete list[id]; else list[id]=v; shopSave({list}); return; }
  if(g("data-shbasic")){ const list={...(shopData().list||{})}; let n=0; for(const it of shopCatalog().filter(i=>i.basic)) if(!list[it.id]){ list[it.id]=1; n++; } shopSave({list}); shopToast(n?`⭐ ${n} artigos da cesta básica na lista!`:"A cesta básica já está toda na lista 👍"); return; }
  if(g("data-shadd")){ S.shop.modal="add"; S.shop.aname=""; S.shop.aq="1"; S.shop.acat=null; renderShop(); setTimeout(()=>$("sh-aname")?.focus(),40); return; }
  if(g("data-shmodalx")){ S.shop.modal=null; renderShop(); return; }
  if(x=g("data-shaq")){ const i=$("sh-aqv"); const cur=parseNumber(String(i?.value||S.shop.aq||"1")); const v=Math.max(1,Math.round(((isFinite(cur)?cur:1)+ +x.dataset.shaq)*100)/100); S.shop.aq=shopQty(v); if(i) i.value=S.shop.aq; return; }
  if(x=g("data-shacat")){ S.shop.acat=x.dataset.shacat; const p=$("sh-apreview"); if(p) p.innerHTML=shopAddPreviewHtml(); return; }
  if(x=g("data-shmkt")){ S.shop.mkt=x.dataset.shmkt; renderShop(); if(S.shop.mkt==="Outro") setTimeout(()=>$("sh-pother")?.focus(),40); return; }
  if(x=g("data-shpricefor")){ S.shop.tab="prices"; S.shop.pf={item:x.dataset.shpricefor}; renderShop(true); setTimeout(()=>$("sh-psize")?.focus(),40); return; }
  if(g("data-shsend")){ shopSend(); return; }
  if(g("data-shcopy")){ shopCopy(); return; }
  if(g("data-shcopyto")){ copyText((shopData().email||"").split(/[,;]\s*/).filter(Boolean).join(", "),"📧 E-mail copiado"); return; }
  if(g("data-shsplash")){ shopSave({splash:shopData().splash===false}); return; }
  if(g("data-shclear")){ if(!(await askYesNo("Apagar todos os artigos da lista de compras?","Sim, limpar"))) return; shopSave({list:{}}); shopToast("Lista limpa 🧹"); return; }
  if(x=g("data-shdelprice")){ const p=(shopData().prices||[]).find(r=>r.id===x.dataset.shdelprice); if(!p) return;
    if(!(await askYesNo(`Apagar o preço de ${p.item}${p.size?" ("+p.size+")":""} no ${p.market} — ${fmtE(p.price)}?`))) return;
    shopSave({prices:(shopData().prices||[]).filter(r=>r.id!==p.id)}); shopToast("Preço apagado"); return; }
  if(x=g("data-shdelcustom")){ const d=shopData(), c=(d.custom||[]).find(r=>r.id===x.dataset.shdelcustom); if(!c) return;
    if(!(await askYesNo(`Apagar o artigo “${c.name}”? Também sai da lista de compras.`))) return;
    const list={...(d.list||{})}; delete list[c.id]; shopSave({custom:(d.custom||[]).filter(r=>r.id!==c.id),list}); shopToast("Artigo apagado"); return; }
}
function shopSubmit(ev){ ev.preventDefault(); const f=ev.target;
  if(f.id==="sh-aform") shopAddSave();
  else if(f.id==="sh-pform") shopPriceSave();
  else if(f.id==="sh-sform"){ const v=$("sh-email").value.trim(); const parts=v?v.split(/[,;]\s*/).filter(Boolean):[];
    if(parts.some(p=>!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(p))){ shopToast("Esse e-mail não parece certo"); $("sh-email").focus(); return; }
    S.shop.emailDraft=null; shopSave({email:parts.join(", ")}); shopToast(parts.length?"E-mail guardado ✅":"E-mail removido"); } }
function shopAddSave(){ let name=(S.shop.aname||"").trim(); let q=parseNumber(String(S.shop.aq||"1")); if(!isFinite(q)||q<=0) q=1;
  const lead=/^(\d+(?:[.,]\d+)?)\s*x?\s+(.+)$/i.exec(name); if(lead){ const n=parseNumber(lead[1]); if(isFinite(n)&&n>0){ q=n; name=lead[2]; } }
  if(!name){ $("sh-aname")?.focus(); return; }
  const d=shopData(), list={...(d.list||{})}, found=shopFind(name);
  if(found){ list[found.id]=Math.round(((+list[found.id]||0)+q)*100)/100; S.shop.modal=null; S.shop.pop=found.id; if(S.shop.tab==="choose") S.shop.cat=found.cat; shopSave({list}); shopToast(`${found.e} ${found.name} já existia — agora são ${shopQty(list[found.id])}`); return; }
  const cat=S.shop.acat||shopGuessCat(name); const it={id:"c-"+uidGen(),name:shopTitle(name),e:shopGuessEmoji(name,cat),cat};
  list[it.id]=Math.round(q*100)/100; S.shop.modal=null; S.shop.pop=it.id; if(S.shop.tab==="choose") S.shop.cat=cat;
  shopSave({custom:[...(d.custom||[]),it],list}); shopToast(`${it.e} ${it.name} criado em ${shopCat(cat).name}`); }
function shopPriceSave(){ const pf=S.shop.pf||{}; const item=(pf.item||"").trim(), size=(pf.size||"").trim();
  const market=S.shop.mkt==="Outro"?shopTitle(pf.other||""):(S.shop.mkt||"Mercadona"); const price=parseNumber(String(pf.price||"").replace(/€/g,"").trim());
  if(!item){ shopToast("Escreve o artigo"); $("sh-pitem")?.focus(); return; }
  if(!market){ shopToast("Escreve o nome do mercado"); $("sh-pother")?.focus(); return; }
  if(!isFinite(price)||price<=0){ shopToast("Escreve o preço, ex. 1,29"); $("sh-pprice")?.focus(); return; }
  const known=shopFind(item), name=known?known.name:shopTitle(item);
  const all=shopData().prices||[]; const same=r=>shopSame(r.item,name)&&shopNorm(r.size||"")===shopNorm(size)&&shopNorm(r.market)===shopNorm(market);
  const upd=all.some(same);
  const prices=[...all.filter(r=>!same(r)),{id:uidGen(),item:name,size,market,price:Math.round(price*100)/100,date:todayStr()}];
  S.shop.pf={item:name,size,other:pf.other};
  shopSave({prices}); shopToast(`${upd?"🔄 Atualizado":"💾 Guardado"}: ${name}${size?" — "+size:""} · ${market} ${fmtE(price)}`);
  setTimeout(()=>$("sh-pprice")?.focus(),60); }
function shopText(){ const L=shopList(), out=["🛒 Lista de compras — Família Manico 360º",fmtDate(todayStr()),""];
  for(const c of SHOP_CATS){ const rows=L.filter(([it])=>it.cat===c.k); if(!rows.length) continue; out.push(`${c.e} ${c.name.toUpperCase()}`);
    for(const [it,q] of rows){ const g=shopBestGroup(it.name); out.push(`• ${it.name} × ${shopQty(q)}${g?`   (mais barato: ${g.rows[0].market} ${fmtE(g.rows[0].price)}${g.size?" · "+g.size:""})`:""}`); } out.push(""); }
  const sv=shopSavings(); out.push(`Total: ${L.length} ${L.length===1?"artigo":"artigos"}`); if(sv.covered&&sv.save>0) out.push(`Poupança possível escolhendo o mercado mais barato: ${fmtE(sv.save)}`);
  return out.join("\n"); }
const SHOP_API="https://nossas-compras-api.onrender.com"; let shopSending=false, shopWhy="";
try{ fetch(SHOP_API+"/health",{mode:"no-cors"}).catch(()=>{}); }catch(_){}
function shopPayload(){ const L=shopList(), sv=shopSavings();
  const cats=SHOP_CATS.map(cc=>({name:cc.name,e:cc.e,c:cc.c,s:cc.s,items:L.filter(([it])=>it.cat===cc.k).map(([it,q])=>{ const g=shopBestGroup(it.name); return {e:it.e,name:it.name,qty:shopQty(q),best:g?`Mais barato: ${g.rows[0].market} ${fmtE(g.rows[0].price)}${g.size?" · "+g.size:""}`:""}; })})).filter(cc=>cc.items.length);
  return {date:fmtDate(todayStr()),total:L.length,cats,save:(sv.covered&&sv.save>0)?fmtE(sv.save):""}; }
function shopSubject(){ return `Lista de compras — ${fmtDate(todayStr())}`; }
function shopSend(){ const d=shopData(); if(!shopList().length){ shopToast("A lista está vazia"); return; }
  if(!d.email){ S.shop.tab="settings"; renderShop(true); shopToast("Primeiro escreve o e-mail de destino 📧"); setTimeout(()=>$("sh-email")?.focus(),60); return; }
  if(shopSending) return; shopSending=true; shopToast("📤 A enviar a lista… pode demorar até 1 minuto");
  let ctrl=null, tm=0; try{ ctrl=new AbortController(); tm=setTimeout(()=>ctrl.abort(),100000); }catch(_){}
  const fail=why=>{ shopWhy=why||"?"; S.shop.modal="send"; renderShop(); shopToast(why==="recipient_not_allowed"?"Este e-mail não está autorizado no servidor":"Não consegui enviar sozinho — usa os botões abaixo"); };
  fetch(SHOP_API+"/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({to:d.email,subject:shopSubject(),text:shopText(),payload:shopPayload()}),signal:ctrl?ctrl.signal:undefined})
    .then(r=>r.json().then(j=>({ok:r.ok&&j&&j.ok,error:j&&j.error}),()=>({ok:false,error:"json"})))
    .then(res=>{ if(res.ok) shopToast("✅ Lista enviada para "+d.email); else fail(res.error); },()=>fail("net"))
    .then(()=>{ clearTimeout(tm); shopSending=false; }); }
function shopSendModal(){ const to=(shopData().email||"").split(/[,;]\s*/).filter(Boolean), txt=shopText();
  return `<div class="sh-modal"><div class="sh-card" role="dialog" aria-modal="true" aria-labelledby="sh-sh">
    <div style="display:flex;align-items:center;gap:10px"><h2 class="sh-h" id="sh-sh" style="margin-right:auto"><span aria-hidden="true">✉️</span>Lista pronta para enviar</h2><button type="button" class="sh-x" data-shmodalx="1" aria-label="Fechar">✕</button></div>
    <div class="sh-lab">Para<div class="sh-sel" id="sh-to">${esc(to.join(", "))}</div></div>
    <div class="sh-lab">Assunto<div class="sh-sel">${esc(shopSubject())}</div></div>
    <div class="sh-pills"><a class="sh-big" id="sh-mailto" href="mailto:${esc(to.join(","))}?subject=${encodeURIComponent(shopSubject())}&body=${encodeURIComponent(txt)}" target="_blank" rel="noopener"><span class="e" aria-hidden="true">✉️</span>Abrir o e-mail</a>
      <button type="button" class="sh-big alt" data-shcopy="1"><span class="e" aria-hidden="true">📋</span>Copiar a lista</button>
      <button type="button" class="sh-big alt" data-shcopyto="1"><span class="e" aria-hidden="true">📧</span>Copiar o e-mail</button></div>
    <p class="sh-meta" style="margin:0">O envio automático não funcionou desta vez (código: <b>${esc(shopWhy||"—")}</b>). Toca em <b>Abrir o e-mail</b>, ou em <b>Copiar a lista</b> e cola numa mensagem para o endereço acima, e confirma que a mensagem saiu.</p>
    <textarea class="sh-in" id="sh-txt" readonly rows="8" style="min-height:160px;padding:12px 16px;font-size:18px" aria-label="Texto da lista">${esc(txt)}</textarea></div></div>`; }
function copyText(txt,okMsg){ const ok=()=>shopToast(okMsg);
  const fallback=()=>{ const ta=document.createElement("textarea"); ta.value=txt; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0"; $("shop").append(ta); ta.select(); let done=false; try{ done=document.execCommand("copy"); }catch(_){} ta.remove();
    if(done) ok(); else { const box=$("sh-txt"); if(box){ box.focus(); box.select(); } shopToast("Não deu para copiar sozinho: o texto ficou selecionado, usa Copiar do teclado"); } };
  try{ navigator.clipboard.writeText(txt).then(ok,fallback); }catch(_){ fallback(); } }
function shopCopy(){ copyText(shopText(),"📋 Lista copiada"); }


/* home-screen icon for "Add to home screen": a cart on the family's orange-pink tile, drawn here so no file is needed */
try{ const cv=document.createElement("canvas"); cv.width=cv.height=180; const g=cv.getContext("2d"); const gr=g.createLinearGradient(0,0,180,180); gr.addColorStop(0,"#ffb347"); gr.addColorStop(1,"#ff5f8f");
  g.fillStyle=gr; g.fillRect(0,0,180,180); g.font="110px sans-serif"; g.textAlign="center"; g.textBaseline="middle"; g.fillText("🛒",90,98);
  const url=cv.toDataURL("image/png"); for(const rel of ["apple-touch-icon","icon"]){ const l=document.createElement("link"); l.rel=rel; l.href=url; document.head.append(l); }
  const m=document.createElement("meta"); m.name="apple-mobile-web-app-title"; m.content="Compras"; document.head.append(m); }catch(_){}
openShop();
