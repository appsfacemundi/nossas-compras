<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffb347">
<title>Família Manico 360º Nossas Compras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* layout: one full-screen kitchen-tablet app. big tappable tiles on a warm ground, four panels along the top, the family picture in the middle.
   palette: --sun #ffb347, --berry #ff5f8f, --leaf #16a34a, --ink #1f2937, --cream #fff8ee. type: Fredoka (rounded, friendly) with system rounded fallbacks. */
:root{--sun:#ffb347;--berry:#ff5f8f;--leaf:#16a34a;--ink:#1f2937;--cream:#fff8ee;--kid:"Fredoka",ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html,body{height:100%}
body{background:var(--cream);color:var(--ink);overflow:hidden}
#shop{position:fixed;inset:0;z-index:90;background:#fff8ee;color:#1f2937;font-family:var(--kid);display:flex;flex-direction:column;overflow:hidden;color-scheme:light}
#shop *{box-sizing:border-box}
#shop button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
#shop button:focus-visible,#shop .sh-in:focus-visible{outline:4px solid #ec4899;outline-offset:2px}
.sh-top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px 16px;padding:10px 18px;background:#fff;box-shadow:0 3px 0 #f3e8d8;position:relative;z-index:2}
.sh-brand{display:flex;align-items:center;gap:12px;min-width:0;grid-column:1}
.sh-fam{grid-column:2;width:112px;height:112px;border-radius:50%;object-fit:cover;background:#fff;border:5px solid #fff;box-shadow:0 0 0 4px #ffb347,0 10px 24px rgba(236,72,153,.28);animation:shfam 3.2s ease-in-out infinite}
@keyframes shfam{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-3deg)}}
.sh-top .sh-tabs{grid-column:3;justify-self:end;flex-wrap:nowrap}
@media (max-width:1240px){ .sh-top .sh-tab{min-width:0;padding:6px 10px;font-size:14px} .sh-fam{width:100px;height:100px} .sh-brand b{font-size:25px} }
@media (max-width:900px){ .sh-top .sh-tabs{grid-column:1/-1;justify-self:center} .sh-fam{width:92px;height:92px} .sh-brand b{font-size:22px} .sh-top .sh-tab{min-width:84px} }
@media (max-width:760px){ .sh-top .sh-tab{min-width:0;padding:6px 2px;font-size:13px} }
@media (max-width:560px){ .sh-top{grid-template-columns:minmax(0,1fr) auto} .sh-fam{width:66px;height:66px;border-width:3px;box-shadow:0 0 0 3px #ffb347,0 6px 14px rgba(236,72,153,.25)} }
.sh-logo{width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,#ffb347,#ff5f8f);display:grid;place-items:center;font-size:30px;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.sh-brand small{display:block;font:600 13px/1.1 var(--kid);color:#be185d;letter-spacing:.06em;text-transform:uppercase}
.sh-brand b{display:block;font:700 28px/1.05 var(--kid);color:#1f2937}
.sh-tabs{display:flex;gap:8px;flex-wrap:wrap}
.sh-tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:86px;min-height:70px;padding:8px 10px;border-radius:20px;border:3px solid transparent;background:#f7f1e8;color:#374151;font:600 16px/1.1 var(--kid)}
.sh-tab .e{font-size:28px;line-height:1}
.sh-tab[aria-current="page"]{background:#fff;border-color:#ff8a65;color:#c2410c;box-shadow:0 4px 12px rgba(255,138,101,.28)}
.sh-tab .n{position:absolute;top:-8px;right:-6px;background:#16a34a;color:#fff;border-radius:13px;min-width:26px;height:26px;font:700 14px/20px var(--kid);padding:0 6px;border:3px solid #fff}
.sh-close{background:#1f2937!important;color:#fff!important}
.sh-close .e{font-size:24px!important;font-weight:700}
.sh-main{flex:1;overflow:auto;padding:20px 18px 130px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sh-wrap{max-width:1100px;margin:0 auto;display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
#sh-browse{display:grid;gap:18px;min-width:0}#sh-qres{min-width:0}#sh-qres:empty{display:none}
.sh-cats{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.sh-cat{display:flex;align-items:center;gap:8px;min-height:60px;padding:0 22px;border-radius:999px;border:3px solid var(--c);background:#fff;color:var(--c);font:600 20px/1 var(--kid);white-space:nowrap;flex:none}
.sh-cat .e{font-size:28px}
.sh-cat[aria-pressed="true"]{background:var(--c);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 40%,transparent)}
.sh-search{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid #f1e4d2;border-radius:22px;padding:6px 10px 6px 16px;font-size:24px;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.sh-search:focus-within{border-color:#ff9f43}
.sh-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:600 22px/1.2 var(--kid);padding:12px 4px;color:#1f2937;-webkit-appearance:none;appearance:none}
.sh-search .x{border:0;background:#f7f1e8;border-radius:14px;min-width:48px;min-height:48px;font-size:20px;color:#6b7280}
.sh-hist{display:grid;gap:10px}.sh-hhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.sh-hhead b{font-size:19px}
.sh-chips{display:flex;flex-wrap:wrap;gap:6px}.sh-chip{background:#f7f1e8;border-radius:12px;padding:5px 10px;font-size:15px}
.sh-link.danger{font-size:22px;background:transparent;border:0}
.sh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.sh-tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:170px;padding:18px 10px;border-radius:28px;border:4px solid #f1e6d6;background:#fff;color:#1f2937;box-shadow:0 5px 0 #efe3d1;transition:transform .12s,background .15s}
.sh-tile .e{font-size:68px;line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.12))}
.sh-tile .t{font:600 20px/1.15 var(--kid);text-align:center}
.sh-tile:active{transform:scale(.95)}
.sh-tile.on{border-color:var(--c);background:var(--s);box-shadow:0 5px 0 var(--c)}
.sh-tile .ck{position:absolute;top:10px;right:10px;min-width:40px;height:40px;padding:0 8px;border-radius:20px;background:var(--c);color:#fff;display:grid;place-items:center;font:700 19px/1 var(--kid)}
.sh-tile.pop{animation:shpop .38s ease}
@keyframes shpop{0%{transform:scale(1)}40%{transform:scale(1.12) rotate(-3deg)}100%{transform:scale(1)}}
.sh-tile.add{border-style:dashed;border-color:#f59e0b;background:#fffbeb;color:#b45309}
.sh-plus{position:absolute;left:50%;top:28%;font:700 30px var(--kid);color:#16a34a;pointer-events:none;animation:shplus .75s ease-out forwards}
@keyframes shplus{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}
.sh-bar{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:26px 18px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(255,248,238,0),#fff8ee 45%);display:flex;justify-content:center;gap:12px;pointer-events:none}
.sh-bar>*{pointer-events:auto}
.sh-big{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:66px;padding:0 28px;border-radius:999px;border:0;font:600 22px/1.1 var(--kid);color:#fff;background:linear-gradient(145deg,#22c55e,#15803d);box-shadow:0 6px 0 #14532d;text-align:center}
.sh-big:disabled{opacity:.7;cursor:wait}
.sh-big:active{transform:translateY(3px);box-shadow:0 3px 0 #14532d}
.sh-big.alt{background:#fff;color:#1f2937;box-shadow:0 5px 0 #e5d9c6;border:3px solid #eadfcd}
.sh-big.pink{background:linear-gradient(145deg,#ff8a65,#ec4899);box-shadow:0 6px 0 #9d174d}
.sh-big.warn{background:#fff;color:#b91c1c;border:3px solid #fecaca;box-shadow:0 5px 0 #fecaca}
.sh-big .e{font-size:28px;line-height:1}
.sh-card{background:#fff;border-radius:28px;padding:20px;box-shadow:0 5px 0 #efe3d1;border:3px solid #f1e6d6}
.sh-h{font:700 27px/1.15 var(--kid);margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:#1f2937}
.sh-meta{color:#5b6472;font:500 17px/1.4 var(--kid)}
.sh-grp{display:flex;align-items:center;gap:8px;font:700 17px var(--kid);color:var(--c);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 4px}
.sh-row{display:grid;grid-template-columns:66px minmax(0,1fr) auto;align-items:center;gap:14px;padding:10px 2px;border-bottom:2px dashed #f1e6d6}
.sh-row:last-child{border-bottom:0}
.sh-ic{width:66px;height:66px;border-radius:22px;background:var(--s);display:grid;place-items:center;font-size:40px}
.sh-name{font:600 23px/1.15 var(--kid)}
.sh-hint{display:inline-flex;margin-top:5px;padding:4px 12px;border-radius:999px;background:#dcfce7;color:#166534;font:500 15px var(--kid)}
.sh-link{margin-top:4px;border:0;background:none;padding:4px 0;color:#b45309;font:500 16px var(--kid);text-decoration:underline;text-underline-offset:3px}
.sh-step{display:flex;align-items:center;gap:8px}
.sh-step button{width:56px;height:56px;border-radius:50%;border:0;font:700 30px/1 var(--kid);background:#f1f5f9;color:#1f2937;flex:none}
.sh-step button.p{background:#22c55e;color:#fff}
.sh-step .q{min-width:46px;text-align:center;font:700 28px var(--kid)}
.sh-empty{text-align:center;padding:40px 18px;display:grid;gap:14px;justify-items:center}
.sh-empty>.e{font-size:92px;line-height:1}
.sh-in{width:100%;min-height:60px;border-radius:18px;border:3px solid #eadfcd;background:#fff;padding:0 16px;font:500 22px var(--kid);color:#1f2937}
.sh-in:focus{outline:none;border-color:#ff8a65;box-shadow:0 0 0 4px rgba(255,138,101,.22)}
.sh-lab{display:grid;gap:7px;font:600 18px var(--kid);color:#374151}
.sh-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.sh-pills{display:flex;gap:10px;flex-wrap:wrap}
.sh-pill{min-height:54px;padding:0 20px;border-radius:999px;border:3px solid #eadfcd;background:#fff;font:600 19px var(--kid);color:#374151}
.sh-pill[aria-pressed="true"]{background:#1f2937;border-color:#1f2937;color:#fff}
.sh-price{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;min-height:56px;padding:6px 8px 6px 14px;border-radius:16px;background:#f8fafc;font:500 20px var(--kid)}
.sh-price.best{background:#dcfce7;color:#14532d;font-weight:700}
.sh-price .d{font-size:16px;color:#b91c1c;font-weight:600}
.sh-x{width:48px;height:48px;border-radius:50%;border:0;background:transparent;color:#94a3b8;font:700 21px var(--kid)}
.sh-x:hover{background:#fee2e2;color:#b91c1c}
.sh-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.sh-stat{border-radius:20px;padding:14px 16px;background:#f8fafc}
.sh-stat .v{font:700 34px/1.1 var(--kid)}
.sh-stat.g{background:#dcfce7;color:#14532d}
.sh-verdict{padding:12px 16px;border-radius:18px;background:#fef3c7;color:#78350f;font:500 19px/1.4 var(--kid)}
.sh-verdict b{font-weight:700}
.sh-modal{position:absolute;inset:0;z-index:20;background:rgba(31,41,55,.5);display:grid;place-items:center;padding:16px}
.sh-modal>.sh-card{width:min(600px,100%);max-height:92vh;overflow:auto;display:grid;gap:16px;animation:shup .25s ease both}
.sh-voice{position:absolute;right:14px;bottom:calc(120px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;gap:8px;align-items:center}
.sh-voice button{border:0;border-radius:999px;background:#1f2937;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.25);font:700 15px var(--kid)}
#sh-vlang{width:46px;height:46px}
#sh-vmic{width:68px;height:68px;font-size:30px;background:linear-gradient(145deg,#ffb347,#ff5f8f)}
#sh-vmic.live{background:#dc2626;animation:vpulse 1s infinite}
@keyframes vpulse{50%{box-shadow:0 0 0 12px rgba(220,38,38,.2)}}
@media (prefers-reduced-motion:reduce){#sh-vmic.live{animation:none}}
.sh-toast{position:absolute;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;max-width:calc(100% - 32px);background:#1f2937;color:#fff;padding:14px 24px;border-radius:24px;font:600 19px/1.3 var(--kid);box-shadow:0 10px 26px rgba(0,0,0,.25);text-align:center}
.sh-splash{position:absolute;inset:0;z-index:40;display:grid;place-items:center;overflow:hidden;cursor:pointer;background:radial-gradient(circle at 25% 18%,#fff3b0 0,rgba(255,243,176,0) 42%),radial-gradient(circle at 82% 82%,#ffc2d6 0,rgba(255,194,214,0) 48%),linear-gradient(160deg,#7dd3fc,#a78bfa 55%,#f9a8d4);transition:opacity .45s,transform .45s}
.sh-splash.bye{opacity:0;transform:scale(1.06);pointer-events:none}
.sh-float{position:absolute;top:-90px;animation:shfall linear infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.15))}
@keyframes shfall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(calc(100vh + 180px)) rotate(360deg)}}
.sh-sp-in{position:relative;text-align:center;display:grid;gap:16px;justify-items:center;padding:24px}
.sh-sp-cart{font-size:124px;line-height:1;animation:shcart 1.1s cubic-bezier(.2,.9,.3,1.3) both,shbob 2.4s 1.1s ease-in-out infinite}
@keyframes shcart{from{transform:translateX(-75vw) rotate(-12deg)}to{transform:none}}
@keyframes shbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.sh-sp-fam{background:#fff;color:#7c3aed;font:700 19px/1 var(--kid);padding:11px 20px;border-radius:999px;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 6px 18px rgba(0,0,0,.12);animation:shup .6s .45s both}
.sh-sp-t{margin:0;font:700 clamp(50px,9.5vw,104px)/1 var(--kid);color:#fff;text-shadow:0 5px 0 #db2777,0 12px 26px rgba(0,0,0,.2);display:flex;flex-wrap:wrap;justify-content:center}
.sh-sp-t span{display:inline-block;animation:shletter .6s cubic-bezier(.2,.9,.3,1.5) both}
@keyframes shletter{from{opacity:0;transform:translateY(40px) scale(.4)}to{opacity:1;transform:none}}
@keyframes shup{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.sh-sp-sub{font:600 24px/1.3 var(--kid);color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.22);animation:shup .6s 1.3s both}
.sh-sp-go{animation:shup .6s 1.5s both}
@media (max-width:760px){
  .sh-top{padding:10px 12px}
  .sh-brand b{font-size:22px} .sh-logo{width:46px;height:46px;font-size:26px}
  .sh-tabs{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .sh-tab{min-width:0;min-height:62px;font-size:13px;padding:6px 2px} .sh-tab .e{font-size:24px}
  .sh-main{padding:14px 12px 130px}
  .sh-grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
  .sh-tile{min-height:146px} .sh-tile .e{font-size:56px} .sh-tile .t{font-size:18px}
  .sh-row{grid-template-columns:54px minmax(0,1fr)} .sh-row .sh-step{grid-column:1/-1;justify-content:flex-end} .sh-row .sh-x{grid-column:auto}
  .sh-ic{width:54px;height:54px;font-size:32px}
  .sh-big{font-size:19px;min-height:60px;padding:0 20px}
  .sh-price{font-size:18px}
}
@media (prefers-reduced-motion:reduce){#shop *,#shopfab *{animation:none!important;transition:none!important} .sh-float{display:none}}
.sh-toast.top{top:14px;bottom:auto}
.sh-sel{background:#fff8ee;border:3px dashed #eadfcd;border-radius:16px;padding:12px 16px;font:600 20px/1.35 var(--kid);color:#1f2937;user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}
a.sh-big{text-decoration:none}
.sh-top{padding-top:calc(10px + env(safe-area-inset-top,0px))}

/* ---- 3 sections: side rail + body ---- */
#shop{flex-direction:row}
.sh-side{flex:none;width:132px;display:flex;flex-direction:column;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 10px calc(12px + env(safe-area-inset-bottom,0px));background:#fff;box-shadow:3px 0 0 #f3e8d8;overflow-y:auto;z-index:4}
.sh-sb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:112px;padding:10px 4px;border-radius:26px;border:0;background:#f7f1e8;color:#374151;font:600 16px/1.15 var(--kid);text-align:center;flex:none}
.sh-sb .e{font-size:44px;line-height:1}
.sh-sb[aria-current="page"]{background:var(--g);color:#fff;box-shadow:0 6px 0 rgba(31,41,55,.2)}
.sh-sb .n{position:absolute;top:6px;right:6px;background:#16a34a;color:#fff;border-radius:13px;min-width:26px;height:26px;font:700 14px/20px var(--kid);padding:0 6px;border:3px solid #fff}
.sh-sb.set{min-height:86px} .sh-sb.set .e{font-size:30px}
.sh-side .sp{flex:1}
.sh-body{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.sh-bar{position:absolute}
.sh-top{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
@media (max-width:700px){
  #shop{flex-direction:column-reverse}
  .sh-side{width:auto;flex-direction:row;gap:6px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -3px 0 #f3e8d8;overflow:visible}
  .sh-sb{flex:1;min-height:64px;border-radius:18px;font-size:12px;padding:4px 2px} .sh-sb .e{font-size:26px} .sh-sb.set{min-height:64px} .sh-sb.set .e{font-size:24px}
  .sh-side .sp{display:none}
}
.sh-big.gold{background:linear-gradient(145deg,#fbbf24,#d97706);box-shadow:0 6px 0 #92400e}
.sh-big.kit{background:linear-gradient(145deg,#2dd4bf,#0d9488);box-shadow:0 6px 0 #115e59}
/* people */
.sh-people{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.sh-person{position:relative;display:flex;align-items:center;gap:10px;min-height:68px;padding:6px 20px 6px 7px;border-radius:999px;border:3px solid #eadfcd;background:#fff;font:600 19px/1.1 var(--kid);color:#1f2937;flex:none;text-align:left}
.sh-person b{font-weight:700}
.sh-person small{display:block;font:500 14px/1.2 var(--kid);color:#6b7280;margin-top:2px}
.sh-person .av,.sh-prow .av{width:50px;height:50px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 28px/1 var(--kid);flex:none}
.sh-brand>span{min-width:0}.sh-brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sh-brand b{overflow-wrap:anywhere}
@media (max-width:1000px){.sh-brand small{display:none}}
.sh-person[aria-pressed="true"]{border-color:var(--c);box-shadow:0 5px 0 var(--c)}
.sh-person.add{border-style:dashed;border-color:#f59e0b} .sh-person.add .av{background:#fef3c7;color:#b45309}
.sh-person .n{position:absolute;top:-8px;right:-4px;background:#16a34a;color:#fff;border-radius:13px;min-width:26px;height:26px;font:700 14px/20px var(--kid);padding:0 6px;border:3px solid #fff;text-align:center}
.sh-prow{display:flex;align-items:center;gap:14px;padding:8px 0;border-bottom:2px dashed #f1e6d6;flex-wrap:wrap}
.sh-prow .sh-big{min-height:52px;font-size:18px;padding:0 18px}
.sh-subs{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:5px}
.sh-subs .sh-hint,.sh-subs .sh-link{margin-top:0}
.sh-pk{display:inline-flex;padding:4px 12px;border-radius:999px;background:#f1f5f9;color:#334155;font:500 15px var(--kid)}
.sh-szl{display:inline-flex;align-items:center;gap:8px;font:600 16px var(--kid);color:#475569}
.sh-sel2{min-height:48px;border-radius:14px;border:3px solid #eadfcd;background:#fff;font:600 17px var(--kid);padding:0 8px;color:#1f2937}
.sh-chip{display:inline-flex;align-items:center;gap:8px;min-height:50px;padding:0 8px 0 18px;border-radius:999px;background:#f8fafc;border:3px solid #e2e8f0;font:600 18px var(--kid)}
/* price table */
.sh-tw{overflow:auto;max-height:calc(100vh - 230px);min-height:260px;border-radius:22px;border:3px solid #f1e6d6;background:#fff;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sh-pt{border-collapse:separate;border-spacing:0;min-width:100%}
.sh-pt th,.sh-pt td{padding:7px 8px;border-bottom:2px solid #f6eee2;text-align:center;vertical-align:middle;white-space:nowrap}
.sh-pt thead th{position:sticky;top:0;z-index:2;background:#fff8ee;font:700 17px var(--kid);color:#374151}
.sh-pt .pn{position:sticky;left:0;z-index:1;background:#fff;text-align:left;min-width:200px;max-width:250px;white-space:normal;font:600 18px/1.2 var(--kid);box-shadow:3px 0 0 #f6eee2}
.sh-pt thead .pn{z-index:3;background:#fff8ee}
.sh-pt .pe{font-size:28px;margin-right:8px;vertical-align:middle}
.sh-pt tr.cr td{background:var(--s);color:var(--c);font:700 16px var(--kid);text-transform:uppercase;letter-spacing:.05em;text-align:left}
.sh-pin{width:96px;min-height:50px;border-radius:14px;border:3px solid #eadfcd;background:#fff;text-align:center;font:600 19px var(--kid);color:#1f2937;padding:0 6px}
.sh-pin:focus{outline:none;border-color:#ff8a65;box-shadow:0 0 0 4px rgba(255,138,101,.22)}
.sh-pin.best{border-color:#22c55e;background:#dcfce7;color:#14532d}
.sh-pin.sm{width:64px}
.sh-pack{display:flex;gap:6px;justify-content:center}
.mh{display:flex;align-items:center;gap:6px;justify-content:center}
.sh-mx{width:30px;height:30px;border-radius:50%;border:0;background:#fee2e2;color:#b91c1c;font:700 14px var(--kid);flex:none}
.sh-addm{min-height:48px;padding:0 16px;border-radius:999px;border:3px dashed #f59e0b;background:#fffbeb;color:#b45309;font:600 17px var(--kid)}
.sh-mini{display:inline-flex;align-items:center;gap:6px} .sh-mini button{width:40px;height:40px;border-radius:50%;border:0;background:#f1f5f9;font:700 22px/1 var(--kid);color:#1f2937} .sh-mini button.p{background:#22c55e;color:#fff} .sh-mini b{min-width:26px;font:700 19px var(--kid)}
.sh-mini-add{min-height:40px;padding:0 14px;border-radius:999px;border:2px solid #bbf7d0;background:#f0fdf4;color:#15803d;font:600 16px var(--kid)}
.sh-mk{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.sh-mkc{border-radius:20px;padding:12px 16px;background:#f8fafc;border:3px solid #eef2f7;display:grid;gap:2px}
.sh-mkc b{font:700 18px var(--kid)} .sh-mkc .v{font:700 30px/1.15 var(--kid)} .sh-mkc small{font:500 14px var(--kid);color:#64748b}
.sh-mkc.win{background:#dcfce7;border-color:#86efac;color:#14532d} .sh-mkc.win small{color:#166534}
.sh-mkc.mix{background:#fef3c7;border-color:#fcd34d;color:#78350f}
.sh-mkc.none{opacity:.55}
.sh-rep{margin:0;padding:0;list-style:none;display:grid;gap:8px;font:500 19px/1.45 var(--kid)}
.sh-rep li{padding:10px 14px;border-radius:16px;background:#f8fafc}
.sh-rep li:first-child{background:#dcfce7;color:#14532d}

</style>
</head>

function fmt(n){ n=+n||0; return (n<0?"−":"")+Math.abs(n).toLocaleString("pt-PT",{minimumFractionDigits:2,maximumFractionDigits:2})+" €"; }
function parseNumber(tok){ let t=String(tok).replace(/\s|€/g,""); const ld=t.lastIndexOf("."), lc=t.lastIndexOf(",");
  if(ld>-1&&lc>-1){ const dec=ld>lc?".":","; t=t.split(dec==="."?",":".").join("").replace(",","."); }
  else if(lc>-1){ t=t.replace(",","."); }

const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
function variants(s){ const k=norm(s), v=new Set([k]); if(k.endsWith("oes")||k.endsWith("aes")) v.add(k.slice(0,-3)+"ao"); if(k.endsWith("ns")) v.add(k.slice(0,-2)+"m"); if(k.endsWith("es")) v.add(k.slice(0,-2)); if(k.endsWith("s")) v.add(k.slice(0,-1)); return v; }
function same(a,b){ const va=variants(a); for(const x of variants(b)) if(x&&va.has(x)) return true; return false; }

function parsePack(s){ if(!s) return null; const m=/^\s*(\d+(?:[.,]\d+)?)\s*(kg|g|l|ml|cl|un|pack|rolo|rolos|dúzia|duzia)?\s*$/i.exec(String(s)); if(!m) return null;
  let q=parseNumber(m[1]), u=(m[2]||"un").toLowerCase(); if(u==="l") u="L"; if(u==="cl"){ q=q*10; u="ml"; } if(u==="rolos") u="rolo"; if(u==="duzia") u="dúzia"; return isFinite(q)&&q>0?{q,u}:null; }

function migrate(){ const d=DATA;

  if(!d.markets) d.markets={food:[...DEF_MARKETS.food],school:[...DEF_MARKETS.school],clothes:[...DEF_MARKETS.clothes]};
  if(!d.pack) d.pack={};
  /* articles the family created that now exist in the catalog: fold them in */
  if(Array.isArray(d.custom)&&d.custom.length){ const keep=[]; const list={...(d.list||{})};
    for(const c of d.custom){ const b=FOOD_ITEMS.find(i=>[i.name,...i.aliases].some(n=>same(n,c.name)));
      if(b){ if(list[c.id]){ list[b.id]=(+list[b.id]||0)+(+list[c.id]); delete list[c.id]; } } else keep.push(c); }
    d.custom=keep; d.list=list; }
  if(!d.prices2){ d.prices2={food:{},school:{},clothes:{}};
    if(Array.isArray(d.prices)) for(const r of d.prices){ const it=findItem("food",r.item); if(!it||!(r.price>0)) continue;
      (d.prices2.food[it.id]=d.prices2.food[it.id]||{})[r.market]=r.price;
      if(!d.markets.food.includes(r.market)) d.markets.food.push(r.market);
      const pk=parsePack(r.size); if(pk){ d.pack.food=d.pack.food||{}; if(!d.pack.food[it.id]) d.pack.food[it.id]=pk; } } }
  persist(); }

function catalog(sec){ return SECS[sec].items.concat(customs(sec).map(c=>({lv:"P123S",kit:"",sz:"",dq:1,pk:"1 un",...c,e:c.eManual?c.e:guessEmoji(sec,c.name,c.cat),aliases:[],custom:true}))); }

const catOf=(sec,k)=>SECS[sec].cats.find(c=>c.k===k)||SECS[sec].cats[0];

function listMap(sec,pid){ const d=D(); if(sec==="food") return d.list||{}; return (((d.pl||{})[sec])||{})[pid||pidOf(sec)]||{}; }

function sortRows(sec,r){ const order=SECS[sec].cats.map(c=>c.k); return r.sort((a,b)=>order.indexOf(a[0].cat)-order.indexOf(b[0].cat)||a[0].name.localeCompare(b[0].name,"pt")); }
function rows(sec,pid){ const L=listMap(sec,pid), cat=catalog(sec); return sortRows(sec,Object.entries(L).map(([id,q])=>[cat.find(i=>i.id===id),+q]).filter(([it,q])=>it&&q>0)); }
function allRows(sec){ if(sec==="food") return rows("food"); const sum={}; for(const p of people()) for(const [it,q] of rows(sec,p.id)){ if(!sum[it.id]) sum[it.id]=[it,0]; sum[it.id][1]+=q; } return sortRows(sec,Object.values(sum)); }
function countSec(sec){ return sec==="food"?rows("food").length:people().reduce((a,p)=>a+rows(sec,p.id).length,0); }
function ageLevel(a){ a=+a; if(!a) return ""; return a<=5?"P":a<=9?"1":a<=11?"2":a<=14?"3":"S"; }
const levelOf=p=>p?(p.lv||ageLevel(p.age)):"";
const levelName=k=>(LEVELS.find(l=>l.k===k)||{}).short||"";
function defaultSize(p){ const a=+p.age; if(!a) return ""; return a<=14?(a<2?"2":a)+" anos":a<=15?"16 anos":"S"; }
const sizeR=p=>p.size||defaultSize(p);
function sizeFor(pid,it){ const p=person(pid); if(!p||!it.sz) return ""; const own=(((D().psz||{})[pid])||{})[it.id]; return own||(it.sz==="c"?(p.shoe||""):sizeR(p)); }

/* guesses for new articles */
function guessCat(sec,name){ const n=" "+norm(name)+" ";
  if(sec==="food"){ let best=null, bl=0; for(const [w,c] of FOOD_CATP){ const k=norm(w); if(n.includes(" "+k)&&k.length>bl){ best=c; bl=k.length; } } if(best) return best;
    for(const k of ["casa","frescos","fruta"]) if(FOOD_KW[k].some(w=>n.includes(norm(w)))) return k; return "despensa"; }
  let best=null, bl=0; for(const it of SECS[sec].items) for(const w of norm(it.name).split(" ")) if(w.length>=4&&n.includes(" "+w.replace(/s$/,""))&&w.length>bl){ best=it.cat; bl=w.length; }
  return best||SECS[sec].cats[0].k; }
function guessEmoji(sec,name,cat){ const n=" "+norm(name)+" "; let best=null, bl=0;
  const cands=(sec==="food"?FOOD_EMOJI:[]).concat(SECS[sec].items.flatMap(it=>[it.name,...(it.aliases||[])].map(a=>[a,it.e])));
  for(const [w,e] of cands){ const k=norm(w); if(!k) continue; const hit=k.length<=3?n.includes(" "+k+" "):n.includes(" "+k); if(hit&&k.length>bl){ best=e; bl=k.length; } }
  if(!best&&sec!=="food") for(const it of SECS[sec].items) for(const w of norm(it.name).split(" ")) if(w.length>=4&&n.includes(" "+w.replace(/s$/,""))&&w.length>bl){ best=it.e; bl=w.length; }
  return best||catOf(sec,cat).e; }

const mkts=sec=>(D().markets||{})[sec]||DEF_MARKETS[sec];
function priceOf(sec,id,m){ const r=(((D().prices2||{})[sec])||{})[id]; return r&&r[m]>0?r[m]:0; }
function setPrice(sec,id,m,v){ const d=D(), p2={...(d.prices2||{})}, s={...(p2[sec]||{})}, r={...(s[id]||{})};
  if(v>0) r[m]=Math.round(v*100)/100; else delete r[m]; s[id]=r; p2[sec]=s; save({prices2:p2},true); }
function packOf(sec,it){ const p=(((D().pack||{})[sec])||{})[it.id]; return p||parsePack(it.pk)||{q:1,u:"un"}; }
function setPack(sec,id,patch,it){ const d=D(), pk={...(d.pack||{})}, s={...(pk[sec]||{})}; s[id]={...packOf(sec,it),...patch}; pk[sec]=s; save({pack:pk},true); }
function bestPrice(sec,id){ let b=null; for(const m of mkts(sec)){ const p=priceOf(sec,id,m); if(p&&(!b||p<b.p)) b={m,p}; } return b; }
function totRows(sec){ if(sec==="food") return rows("food"); const t=S.ptot[sec]||"all"; return t==="all"||!person(t)?allRows(sec):rows(sec,t); }
function analysis(sec,R){ const ms=mkts(sec), per={}; for(const m of ms) per[m]={sum:0,n:0,missing:[]};
  let mixed=0; const plan={}, nop=[];
  for(const [it,q] of R){ const ps=[];
    for(const m of ms){ const p=priceOf(sec,it.id,m); if(p){ per[m].sum+=p*q; per[m].n++; ps.push([m,p]); } else per[m].missing.push(it); }
    if(!ps.length){ nop.push(it); continue; }
    ps.sort((a,b)=>a[1]-b[1]); const [bm,bp]=ps[0]; mixed+=bp*q; if(!plan[bm]) plan[bm]={sum:0,items:[]}; plan[bm].sum+=bp*q; plan[bm].items.push(it); }
  const total=R.length, full=ms.filter(m=>total&&per[m].n===total).sort((a,b)=>per[a].sum-per[b].sum);
  const ranked=ms.filter(m=>per[m].n).sort((a,b)=>per[b].n-per[a].n||per[a].sum-per[b].sum);
  return {ms,per,mixed,plan,nop,total,full,ranked,priced:total-nop.length}; }
function reportLines(sec,R){ const A=analysis(sec,R), out=[];
  if(!A.total) return ["Põe artigos na lista para veres quanto custa em cada mercado."];
  if(!A.priced) return ["Ainda não há preços para os artigos da lista. Escreve-os na tabela em cima."];
  if(A.full.length){ const b=A.full[0], w=A.full[A.full.length-1];
    out.push(`🏆 Tudo num só sítio: <b>${esc(b)}</b> é o mais barato para a lista toda — <b>${fmt(A.per[b].sum)}</b>.`);
    if(A.full.length>1&&A.per[w].sum>A.per[b].sum) out.push(`💶 Face ao ${esc(w)} (${fmt(A.per[w].sum)}) poupas <b>${fmt(A.per[w].sum-A.per[b].sum)}</b>.`);
    for(const m of A.full.slice(1,-1)) out.push(`• ${esc(m)}: ${fmt(A.per[m].sum)} (+${fmt(A.per[m].sum-A.per[b].sum)})`); }
  else if(A.ranked.length){ const b=A.ranked[0]; out.push(`📋 Nenhum mercado tem preço para todos os ${A.total} artigos. O que tem mais é o <b>${esc(b)}</b>: ${A.per[b].n} de ${A.total}, total ${fmt(A.per[b].sum)}.`); }
  const plans=Object.keys(A.plan);
  if(plans.length>1){ const ref=A.full.length?A.per[A.full[0]].sum:null;
    out.push(`💡 Se dividires as compras pelo mais barato de cada artigo, gastas <b>${fmt(A.mixed)}</b>${ref!=null&&ref>A.mixed?` — mais <b>${fmt(ref-A.mixed)}</b> de poupança`:""}:`);
    for(const m of plans.sort((a,b)=>A.plan[b].sum-A.plan[a].sum)) out.push(`• <b>${esc(m)}</b> (${fmt(A.plan[m].sum)}): ${esc(joinPt(A.plan[m].items.map(i=>i.name)))}`); }
  if(A.nop.length) out.push(`⚠️ Sem preço: ${esc(joinPt(A.nop.map(i=>i.name)))}.`);
  return out; }

function noteFor(sec,it,pid){ if(sec==="food"){ const b=bestPrice(sec,it.id); return `Embalagem ${packS(packOf(sec,it))}${b?` · mais barato: ${b.m} ${fmt(b.p)}`:""}`; }

function mailPack(sec,pid){ const s=SECS[sec], p=pid?person(pid):null, R=rows(sec,pid), date=fmtDate(todayStr());
  const subject=`${s.subject}${p?" — "+p.name:""} — ${date}`;
  const cats=s.cats.map(c=>({name:c.name,e:c.e,c:c.c,s:c.s,items:R.filter(([it])=>it.cat===c.k).map(([it,q])=>({e:it.e,name:it.name,qty:qtyS(q),note:noteFor(sec,it,pid)}))})).filter(c=>c.items.length);
  const report=sec==="food"&&R.length?reportLines(sec,R).map(l=>l.replace(/<[^>]+>/g,"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'")):[];
  const sub=p?`${p.name}${personLine(sec,p)?" · "+personLine(sec,p):""}`:"Alimentação";
  const out=[`${s.head} — Família Manico 360º`,sub,date,""];
  for(const c of cats){ out.push(`${c.e} ${c.name.toUpperCase()}`); for(const it of c.items) out.push(`• ${it.name} × ${it.qty}${it.note?`   (${it.note})`:""}`); out.push(""); }
  out.push(`Total: ${R.length} ${R.length===1?"artigo":"artigos"}`); if(report.length){ out.push(""); out.push("PREÇOS"); out.push(...report); }
  return {subject,text:out.join("\n"),n:R.length,payload:{head:s.head,sub,date,total:R.length,cats,report,save:""}}; }

  return fetch(API+"/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({to:D().email,subject:pk.subject,text:pk.text,payload:pk.payload}),signal:ctrl?ctrl.signal:undefined})

async function sendLists(all){ const d=D(), sec=S.sec; if(sending) return;

  for(let i=0;i<packs.length;i++){ const pk=packs[i], res=await postMail(pk); recordSent(sec,targets.filter(pid=>mailPack(sec,pid).n)[i]??null,pk,res.ok); if(res.ok) ok++; else { sending=false; S.modal="send"; S.m={subject:pk.subject,text:pk.text,why:res.error}; render();

  if(g("data-close")){ closeModal(); return; }
  if(x=g("data-mq")){ const i=$("sh-aq"); const cur=parseNumber(String(i?.value||S.m.q||"1")); const v=Math.max(1,Math.round(((isFinite(cur)?cur:1)+ +x.dataset.mq)*100)/100); S.m.q=qtyS(v); if(i) i.value=S.m.q; return; }
  if(x=g("data-mcat")){ S.m.cat=x.dataset.mcat; $("sh-apv").innerHTML=addPreview(); return; }

  if(x=g("data-hsend")){ const h=(D().sent||[]).find(r=>r.id===x.dataset.hsend); if(!h||sending) return; if(!D().email){ S.tab="settings"; render(true); toast("Primeiro escreve o e-mail de destino 📧"); return; }
    sending=true; toast("📤 A enviar de novo… pode demorar até 1 minuto"); const res=await postMail({subject:h.subject,text:h.text,payload:h.payload}); sending=false;
    if(res.ok){ const dt=new Date(); save({sent:(D().sent||[]).map(r=>r.id===h.id?{...r,ok:true,resent:`${pad(dt.getDate())}/${pad(dt.getMonth()+1)} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`}:r)}); toast(`✅ Lista enviada de novo para ${D().email}`); }
    else { S.modal="send"; S.m={subject:h.subject,text:h.text,why:res.error}; render(); toast("Não consegui enviar sozinho — usa os botões abaixo"); } return; }
  if(x=g("data-hload")){ const h=(D().sent||[]).find(r=>r.id===x.dataset.hload); if(!h) return; const cur=listMap(h.sec,h.pid||undefined), n=Object.keys(cur).length;
    if(n&&!(await askYesNo(`A lista${h.pname?" de "+h.pname:""} já tem ${n} ${n===1?"artigo":"artigos"}. Substituir pela lista enviada?`,"Sim, substituir"))) return;
    if(h.pid&&!person(h.pid)){ toast("Essa pessoa já não existe"); return; }
    if(h.pid) S.pid[h.sec]=h.pid; setList(h.sec,{...(h.items||{})},h.pid||undefined,true); S.tab="list"; render(true); toast("📝 Lista reposta"); return; }
  if(x=g("data-hdel")){ if(!(await askYesNo("Apagar esta lista do histórico de enviadas?","Sim, apagar"))) return; save({sent:(D().sent||[]).filter(r=>r.id!==x.dataset.hdel)}); toast("Apagada do histórico"); return; }
  if(g("data-copy")){ const sec=S.sec; copyText(mailPack(sec,SECS[sec].perPerson?pidOf(sec):null).text,"📋 Lista copiada"); return; }
  if(g("data-copytext")){ copyText(S.m.text||"","📋 Lista copiada"); return; }
  if(g("data-clear")){ const sec=S.sec, p=SECS[sec].perPerson?person(pidOf(sec)):null; if(!(await askYesNo(`Apagar todos os artigos da lista${p?" de "+p.name:""}?`,"Sim, limpar"))) return; setList(sec,{}); toast("Lista limpa 🧹"); return; }
  if(g("data-splash")){ save({splash:D().splash===false}); return; }
  if(x=g("data-delcustom")){ const [sec,id]=x.dataset.delcustom.split("|"); const c=customs(sec).find(r=>r.id===id); if(!c) return;
    if(!(await askYesNo(`Apagar o artigo “${c.name}”? Também sai das listas.`))) return; const d=D();
    if(sec==="food"){ const list={...(d.list||{})}; delete list[id]; save({custom:(d.custom||[]).filter(r=>r.id!==id),list}); }
    else { const cs={...(d.customs||{})}; cs[sec]=(cs[sec]||[]).filter(r=>r.id!==id); const pl={...(d.pl||{})}; if(pl[sec]){ pl[sec]={...pl[sec]}; for(const k of Object.keys(pl[sec])){ const m={...pl[sec][k]}; delete m[id]; pl[sec][k]=m; } } save({customs:cs,pl}); }
    toast("Artigo apagado"); return; }
}
function onInput(ev){ const t=ev.target;
  if(t.dataset.mname){ S.m.name=t.value; S.m.cat=null; S.m.emoji=null; const p=$("sh-apv"); if(p) p.innerHTML=addPreview(); return; }

  if(t.dataset.email){ S.emailDraft=t.value; return; }
  if(t.dataset.qSearch){ const sec=S.sec; S.q[sec]=t.value; const has=!!t.value.trim(); const r=$("sh-qres"), b=$("sh-browse"); if(r) r.innerHTML=has?searchHtml(sec,listMap(sec,SECS[sec].perPerson?pidOf(sec):null)):""; if(b) b.style.display=has?"none":""; return; }
  if(t.dataset.psearch){ S.psq=t.value; const q=norm(t.value); document.querySelectorAll("#sh-tw tr[data-row]").forEach(r=>{ r.style.display=!q||r.dataset.name.includes(q)?"":"none"; }); return; } }
function onChange(ev){ const t=ev.target, sec=S.sec;
  if(t.dataset.price!==undefined&&t.dataset.m){ const raw=t.value.trim(), v=raw?parseNumber(raw):0;
    if(raw&&!(v>0)){ toast("Escreve só o preço, ex. 1,29"); t.value=priceS(priceOf(sec,t.dataset.price,t.dataset.m)); return; }
    setPrice(sec,t.dataset.price,t.dataset.m,v); t.value=priceS(v); refreshPrices(t.dataset.price); return; }
  if(t.dataset.packq){ const it=catalog(sec).find(i=>i.id===t.dataset.packq), v=parseNumber(t.value); if(!(v>0)){ t.value=qtyS(packOf(sec,it).q); return; } setPack(sec,it.id,{q:v},it); return; }
  if(t.dataset.packu){ const it=catalog(sec).find(i=>i.id===t.dataset.packu); setPack(sec,it.id,{u:t.value},it); return; }
  if(t.dataset.size){ const [pid,id]=t.dataset.size.split("|"), d=D(), psz={...(d.psz||{})}; psz[pid]={...(psz[pid]||{}),[id]:t.value}; save({psz},true); toast("📏 Tamanho guardado"); return; } }
function onSubmit(ev){ ev.preventDefault(); const f=ev.target;
  if(f.id==="sh-aform") addSave();
  else if(f.id==="sh-pform") personSave();
  else if(f.id==="sh-mform") marketSave();
  else if(f.id==="sh-sform"){ const raw=($("sh-email")?.value||"").trim(); const parts=raw.split(/[,;\s]+/).filter(Boolean);
    if(parts.some(p=>!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(p))){ toast("Esse e-mail não parece certo"); $("sh-email").focus(); return; }
    S.emailDraft=null; save({email:parts.join(", ")}); toast(parts.length?"E-mail guardado ✅":"E-mail removido"); } }
function onKey(e){ const t=e.target;
  if(e.key==="Enter"&&t.classList&&t.classList.contains("sh-pin")){ e.preventDefault(); const td=t.closest("td"), tr=t.closest("tr"); const col=[...tr.children].indexOf(td);
    let nx=tr.nextElementSibling; while(nx&&(nx.style.display==="none"||!nx.dataset.row)) nx=nx.nextElementSibling;
    const next=nx&&nx.children[col]&&nx.children[col].querySelector("input"); t.blur(); if(next){ next.focus(); next.select&&next.select(); } return; }
  if(e.key==="Escape"&&S.modal&&!document.querySelector(".sh-yn")) closeModal(); }

/* ================= voice commands (PT / EN) ================= */
const VSR=window.SpeechRecognition||window.webkitSpeechRecognition;
let vLang="pt-PT", vRec=null, vLive=false;
try{ vLang=localStorage.getItem("nc-vlang")==="en-US"?"en-US":"pt-PT"; }catch(_){}
const vT=(pt,en)=>vLang==="en-US"?en:pt;
const NUMW={um:1,uma:1,one:1,a:1,dois:2,duas:2,two:2,tres:3,three:3,quatro:4,four:4,cinco:5,five:5,seis:6,six:6,sete:7,seven:7,oito:8,eight:8,nove:9,nine:9,dez:10,ten:10};
const hasW=(n,re)=>new RegExp("(^| )("+re+")( |$)").test(n);
function vPerson(n){ /* "… para a Wiklayne" / "for Wigginton": switch person, return the phrase without it */
  const sec=S.sec; if(!SECS[sec].perPerson) return n;
  for(const p of people()){ const f=norm(String(p.name||"").split(/\s+/)[0]); if(!f) continue;
    const re=new RegExp("(^| )((para|pra|da|do|de|for|to)( o| a)? )?"+f+"( |$)");
    if(re.test(n)){ S.pid[sec]=p.id; return n.replace(re," ").replace(/\s+/g," ").trim(); } }
  return n; }
const ENPT={milk:"leite",bread:"pao",rice:"arroz",eggs:"ovos",egg:"ovo",water:"agua",chicken:"frango",beef:"carne",meat:"carne",fish:"peixe",cheese:"queijo",butter:"manteiga",sugar:"acucar",salt:"sal",oil:"oleo",apple:"maca",apples:"macas",tomato:"tomate",tomatoes:"tomate",potato:"batata",potatoes:"batata",onion:"cebola",pasta:"massa",coffee:"cafe",juice:"sumo",pencil:"lapis",pencils:"lapis",notebook:"caderno",pen:"caneta",pens:"caneta",eraser:"borracha",ruler:"regua",backpack:"mochila",shoes:"sapatos",socks:"meias",shirt:"camisa",pants:"calcas",jacket:"casaco",underwear:"cuecas",soap:"sabonete",shampoo:"champo",toothpaste:"pasta de dentes",toilet:"papel higienico",detergent:"detergente",banana:"banana",bananas:"banana",orange:"laranja",oranges:"laranja",yogurt:"iogurte",cereal:"cereais",cookies:"bolachas",biscuits:"bolachas",flour:"farinha",beans:"feijao"};
function vResolve(sec,text){ let t=norm(text).replace(/^(a|o|as|os|the|some|to the list|na lista|a lista)\s+/,""), q=null, m;
  if(m=/^(\d+|um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|dez|one|two|three|four|five|six|seven|eight|nine|ten)\s+(.+)$/.exec(t)){ q=/^\d+$/.test(m[1])?+m[1]:NUMW[m[1]]; t=m[2]; }
  t=t.replace(/^(kg|quilos?|kilos?|litros?|l|pacotes?|packs?|garrafas?|latas?|bottles?|cans?|boxes?|caixas?|packets?)\s+(de\s+|of\s+)?/,"").replace(/\s+(para|a|na|to|on|in)\s+(a\s+|the\s+)?(lista|list)$/,"").trim();
  if(vLang==="en-US"&&t) t=t.split(" ").map(w=>ENPT[w]||w).join(" ");
  let it=t?findItem(sec,t):null, hits=[];
  if(!it&&t){ const words=t.split(" ").filter(Boolean); hits=catalog(sec).filter(i=>{ const hay=norm([i.name,...(i.aliases||[]),catOf(sec,i.cat).name].join(" ")); return words.every(w=>hay.includes(w)); });
    if(hits.length===1) it=hits[0]; else { const ex=hits.filter(i=>norm(i.name)===t); if(ex.length===1) it=ex[0]; } }
  return {it,q,t,hits}; }
function vOpenSearch(sec,t,many){ S.tab="choose"; S.q[sec]=t; S.modal=null; render(true);
  toast(many?vT(`Vários resultados para “${t}” — toca no certo`,`Several matches for “${t}” — tap the right one`):vT(`Não encontrei “${t}”. Toca em Juntar para criar`,`Couldn't find “${t}”. Tap Add to create it`)); }
async function vCommand(raw){ let n=norm(raw); if(!n) return;
  const sec0=S.sec;
  /* send */
  if(hasW(n,"envia|enviar|manda|mandar|send|email")&&!hasW(n,"adiciona|add|poe|mete")){ const all=hasW(n,"todos|todas|all|everyone");
    n=vPerson(n); S.tab="list"; render(true);
    if(!(await askYesNo(vT(`Enviar ${all?"as listas de todos":"esta lista"} por e-mail?`,`Email ${all?"everyone's lists":"this list"}?`),vT("Sim, enviar","Yes, send")))) return;
    sendLists(all); return; }
  /* clear */
  if(hasW(n,"limpa|limpar|esvazia|esvaziar|clear|empty")){ n=vPerson(n); const sec=S.sec, p=SECS[sec].perPerson?person(pidOf(sec)):null;
    if(!(await askYesNo(vT(`Apagar todos os artigos da lista${p?" de "+p.name:""}?`,`Delete every item on the list${p?" of "+p.name:""}?`),vT("Sim, limpar","Yes, clear")))) return;
    setList(sec,{}); toast(vT("Lista limpa 🧹","List cleared 🧹")); return; }
  /* navigate */
  if(hasW(n,"abre|abrir|mostra|mostrar|vai|ir|open|show|go|goto")){ let sec=null,tab=null;
    if(hasW(n,"comida|supermercado|compras|food|groceries|grocery")) sec="food"; else if(hasW(n,"escola|escolar|school")) sec="school"; else if(hasW(n,"roupa|roupas|vestuario|clothes|clothing")) sec="clothes";
    if(hasW(n,"lista|list")) tab="list"; else if(hasW(n,"precos|preco|prices|price")) tab="prices"; else if(hasW(n,"escolher|choose")) tab="choose"; else if(hasW(n,"enviadas|enviados|sent")) tab="sent"; else if(hasW(n,"definicoes|configuracoes|settings")) tab="settings";
    if(!sec&&!tab){ toast(vT(`🤷 Abrir o quê? “${raw}”`,`🤷 Open what? “${raw}”`)); return; }
    if(sec) S.sec=sec; S.tab=tab||(sec?"choose":S.tab); S.psq=""; S.modal=null; vPerson(n); render(true);
    const nm={choose:vT("Escolher","Choose"),list:vT("Lista","List"),prices:vT("Preços","Prices"),sent:vT("Enviadas","Sent"),settings:vT("Definições","Settings")}[S.tab]; toast(`✅ ${SECS[S.sec].name||""} · ${nm}`.replace(/^✅  · /,"✅ ")); return; }
  /* search */
  let m;
  if(m=/^(procura|procurar|pesquisa|pesquisar|search|find|look for)\s+(.+)$/.exec(n)){ const t=vPerson(m[2]); S.tab="choose"; S.q[S.sec]=t; S.modal=null; render(true); toast(`🔍 ${t}`); return; }
  /* remove */
  if(m=/^(tira|tirar|retira|retirar|remove|remover|take off|take out|delete)\s+(.+)$/.exec(n)){ const rest=vPerson(m[2]), sec=S.sec, r=vResolve(sec,rest), L={...listMap(sec)};
    if(!r.it){ toast(vT(`Não encontrei “${r.t}” na lista`,`“${r.t}” not found`)); return; }
    if(!L[r.it.id]){ toast(vT(`${r.it.e} ${r.it.name} não está na lista`,`${r.it.e} ${r.it.name} isn't on the list`)); return; }
    delete L[r.it.id]; setList(sec,L); toast(vT(`➖ ${r.it.e} ${r.it.name} tirado`,`➖ ${r.it.e} ${r.it.name} removed`)); return; }
  /* add */
  if(m=/^(adiciona|adicionar|acrescenta|acrescentar|poe|por|mete|meter|junta|juntar|compra|comprar|add|put|buy|get)\s+(.+)$/.exec(n)){ const rest=vPerson(m[2]), sec=S.sec, r=vResolve(sec,rest);
    if(!r.it){ if(!r.t){ toast(vT("Diz o nome do artigo","Say the item name")); return; } vOpenSearch(sec,r.t,r.hits.length>1); return; }
    const L={...listMap(sec)}, had=+L[r.it.id]||0, add=r.q||(had?1:(sec!=="food"&&r.it.dq)||1);
    L[r.it.id]=Math.round((had+add)*100)/100; S.pop=r.it.id; setList(sec,L); toast(`➕ ${r.it.e} ${r.it.name} — ${qtyS(L[r.it.id])}`); return; }
  toast(vT(`🤷 Não percebi: “${raw}”`,`🤷 Didn't get that: “${raw}”`)); }
function vStop(){ vLive=false; const b=$("sh-vmic"); if(b){ b.classList.remove("live"); b.textContent="🎤"; b.setAttribute("aria-label",vT("Falar","Speak")); } }
function vToggle(){ if(!VSR){ toast(vT("Este navegador não tem reconhecimento de voz","This browser has no speech recognition")); return; }
  if(vLive&&vRec){ try{ vRec.stop(); }catch(_){} return; }
  vRec=new VSR(); vRec.lang=vLang; vRec.interimResults=true; vRec.continuous=false; vRec.maxAlternatives=1; let last="";
  vRec.onstart=()=>{ vLive=true; const b=$("sh-vmic"); b.classList.add("live"); b.textContent="⏹"; toast(vT("🎤 A ouvir… diz um comando","🎤 Listening… say a command")); };
  vRec.onresult=ev=>{ const r=ev.results[ev.results.length-1]; last=r[0].transcript; if(r.isFinal){ const t=last; last=""; vCommand(t); } else toast("🎤 “"+last+"”"); };
  vRec.onerror=ev=>{ const msg={"not-allowed":vT("Microfone bloqueado nas definições","Microphone is blocked in settings"),"service-not-allowed":vT("Liga o Ditado nas definições do iPad","Turn on Dictation in iPad settings"),"no-speech":vT("Não ouvi nada","Heard nothing"),"audio-capture":vT("Microfone não encontrado","No microphone found"),"network":vT("Sem ligação ao serviço de voz","No connection to the speech service")}[ev.error]; if(msg) toast("🎤 "+msg); };
  vRec.onend=()=>{ vStop(); };
  try{ vRec.start(); }catch(_){ vStop(); } }
function vMount(){ if(!VSR||$("sh-voice")) return; const box=document.createElement("div"); box.id="sh-voice"; box.className="sh-voice";
  box.innerHTML=`<button type="button" id="sh-vlang" aria-label="Língua da voz / Voice language"></button><button type="button" id="sh-vmic" aria-label="Falar"></button>`; $("shop").append(box);
  const setL=()=>{ $("sh-vlang").textContent=vLang==="en-US"?"EN":"PT"; $("sh-vmic").textContent="🎤"; $("sh-vmic").setAttribute("aria-label",vT("Falar","Speak")); }; setL();
  $("sh-vlang").addEventListener("click",()=>{ vLang=vLang==="en-US"?"pt-PT":"en-US"; try{ localStorage.setItem("nc-vlang",vLang); }catch(_){} setL(); toast(vLang==="en-US"?"🇬🇧 English: “add milk”, “open list”, “send the list”":"🇵🇹 Português: “adiciona leite”, “abre a lista”, “envia a lista”"); });
  $("sh-vmic").addEventListener("click",vToggle); }

/* ================= boot ================= */
(function boot(){ const el=$("shop"); el.addEventListener("click",onClick); el.addEventListener("input",onInput); el.addEventListener("change",onChange); el.addEventListener("submit",onSubmit); document.addEventListener("keydown",onKey);
  D(); render(true); vMount(); if(D().splash!==false) splash();
  try{ const cv=document.createElement("canvas"); cv.width=cv.height=180; const g=cv.getContext("2d"); const gr=g.createLinearGradient(0,0,180,180); gr.addColorStop(0,"#ffb347"); gr.addColorStop(1,"#ff5f8f");
    g.fillStyle=gr; g.fillRect(0,0,180,180); g.font="110px sans-serif"; g.textAlign="center"; g.textBaseline="middle"; g.fillText("🛒",90,98);
    const url=cv.toDataURL("image/png"); for(const rel of ["apple-touch-icon","icon"]){ const l=document.createElement("link"); l.rel=rel; l.href=url; document.head.append(l); }
    const m=document.createElement("meta"); m.name="apple-mobile-web-app-title"; m.content="Compras"; document.head.append(m); }catch(_){}
})();

})();
